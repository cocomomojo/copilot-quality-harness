test_spec:
  feature: User Registration with Email Validation
  description: |
    Email validation and password alphanumeric check.
    Security: Password should not be logged in plain text.
    PII: Email addresses should be masked in logs.
  component: auto-generated-component
  requires_human_approval: false
  ut:
    - id: UT-001
      title: Valid email acceptance
      category: validation
      input:
        email: test@example.com
        password: Password123
      expected_output:
        valid: true
        message: ""
      mock_dependencies: []
    - id: UT-002
      title: Invalid email rejection
      category: validation
      input:
        email: invalid-email
        password: Password123
      expected_output:
        valid: false
        error: Invalid email format
      mock_dependencies: []
    - id: UT-003
      title: Password must contain letters
      category: validation
      input:
        email: test@example.com
        password: "12345678"
      expected_output:
        valid: false
        error: Password must contain letters and numbers
      mock_dependencies: []
    - id: UT-004
      title: Password must contain numbers
      category: validation
      input:
        email: test@example.com
        password: password
      expected_output:
        valid: false
        error: Password must contain letters and numbers
      mock_dependencies: []
    - id: UT-005
      title: Password minimum 8 characters
      category: validation
      input:
        email: test@example.com
        password: Pass1
      expected_output:
        valid: false
        error: Password must contain letters and numbers (8+ chars)
      mock_dependencies: []
    - id: UT-006
      title: PII masking in logs
      category: security
      input:
        email: sensitive@example.com
        password: SecurePass123
      expected_output:
        valid: true
        log_contains_email: false
        log_contains_password: false
      mock_dependencies: []
  e2e:
    - id: E2E-001
      title: Complete registration flow with valid data
      priority: medium
      steps:
        - action: open_registration_form
        - action: enter_email
          value: newuser@example.com
        - action: enter_password
          value: ValidPass123
        - action: submit_form
    - id: E2E-002
      title: Registration fails with invalid email
      priority: medium
      steps:
        - action: open_registration_form
        - action: enter_email
          value: not-an-email
        - action: enter_password
          value: ValidPass123
        - action: submit_form
    - id: E2E-003
      title: Registration fails with weak password
      priority: medium
      steps:
        - action: open_registration_form
        - action: enter_email
          value: user@example.com
        - action: enter_password
          value: weak
        - action: submit_form
