version: '3.9'

services:
  aws-emulator:
    image: amazon/aws-emulator:latest
    container_name: copilot-aws-emulator
    ports:
      - "9297:9297"
    environment:
      - AWS_ACCOUNT_ID=123456789012
      - AWS_REGION=us-east-1
    volumes:
      - aws-emulator-data:/var/lib/aws-emulator
      - ./certs:/aws-emulator/certs:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:9297/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  aws-emulator-data:
