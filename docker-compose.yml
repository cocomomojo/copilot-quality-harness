version: '3.9'

services:
  aws-emulator:
    build:
      context: .
      dockerfile: Dockerfile.aws-emulator
    container_name: copilot-aws-emulator
    ports:
      - "127.0.0.1:9297:9297"
    environment:
      - HOME=/home/emulator
    volumes:
      - ~/.aws/emulator:/home/emulator/.aws/emulator
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://127.0.0.1:9297/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
