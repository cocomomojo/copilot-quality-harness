services:
  aws-emulator:
    build:
      context: .
      dockerfile: Dockerfile.aws-emulator
    container_name: copilot-aws-emulator
    ports:
      - "127.0.0.1:9297:9297"
    environment:
      - HOME=/home/emulator
      - EMULATOR_TELEMETRY=off
    volumes:
      - ${HOME}/.aws/emulator:/home/emulator/.aws/emulator
    # Run as the host user to avoid permission issues on CI
    # On Linux CI runners (GH Actions), this allows the runner to read/write emulator files
    user: "${UID:-1000}:${GID:-1000}"
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://127.0.0.1:9297/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
