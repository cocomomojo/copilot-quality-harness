name: E2E Test Auto-Healing

on:
  workflow_run:
    workflows: ['Test Matrix']
    types: [completed]
    branches: [main]

permissions:
  contents: write
  checks: read
  actions: read

jobs:
  check-e2e-failures:
    name: Check E2E Test Status
    runs-on: ubuntu-latest
    outputs:
      has_e2e_failures: ${{ steps.check.outputs.has_failures }}
      failure_count: ${{ steps.check.outputs.failure_count }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download test results from parent workflow
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: test-artifacts
      
      - name: Check for E2E test failures
        id: check
        run: |
          echo "🔍 Checking E2E test results..."
          
          # Find E2E test result files
          E2E_RESULTS=$(find test-artifacts -name "*e2e*.json" -type f | head -1)
          
          if [ -z "$E2E_RESULTS" ]; then
            echo "❌ E2E test results not found"
            echo "has_failures=false" >> $GITHUB_OUTPUT
            echo "failure_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check for failures in the test results
          FAILURE_COUNT=$(grep -o '"fail' "$E2E_RESULTS" | wc -l)
          
          if [ "$FAILURE_COUNT" -gt 0 ]; then
            echo "⚠️ Found $FAILURE_COUNT E2E test failures"
            echo "has_failures=true" >> $GITHUB_OUTPUT
            echo "failure_count=$FAILURE_COUNT" >> $GITHUB_OUTPUT
          else
            echo "✅ All E2E tests passed"
            echo "has_failures=false" >> $GITHUB_OUTPUT
            echo "failure_count=0" >> $GITHUB_OUTPUT
          fi

  auto-heal-e2e:
    name: 🤖 AI Auto-Heal E2E Tests
    runs-on: ubuntu-latest
    needs: check-e2e-failures
    if: needs.check-e2e-failures.outputs.has_e2e_failures == 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Download E2E test results
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: test-artifacts
      
      - name: Run E2E tests to get baseline failures
        continue-on-error: true
        run: |
          echo "🧪 Running E2E tests to identify failures..."
          npm run test:e2e 2>&1 | tee e2e-test.log || true
      
      - name: Analyze E2E failures and generate fixes
        id: analyze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔍 Analyzing E2E test failures..."
          
          # Create healing script
          cat > scripts/e2e-healer.mjs << 'EOF'
          import fs from 'fs';
          import path from 'path';
          
          // Parse test output to identify failing tests
          const testLog = fs.readFileSync('e2e-test.log', 'utf8');
          const failedTests = [];
          
          // Extract failed test information
          const failurePattern = /\d+\)\s+(.+?)\n\s+Error:/g;
          let match;
          
          while ((match = failurePattern.exec(testLog)) !== null) {
            failedTests.push(match[1]);
          }
          
          console.log('Failed tests found:', failedTests.length);
          failedTests.forEach(test => console.log('  -', test));
          
          // Common E2E fixes
          const fixes = {
            'toHaveAttribute': {
              problem: /toHaveAttribute\('src', \/\w+\/\)/,
              solution: "Check if src attribute exists instead of regex matching"
            },
            'waitForSelector timeout': {
              problem: /locator\.fill: Timeout/,
              solution: "Increase timeout and add waitForLoadState"
            },
            'getByLabel': {
              problem: /getByLabel\('[\w\s]+'\)/,
              solution: "Use getByRole instead for better reliability"
            }
          };
          
          console.log('\n✅ Suggested fixes:');
          Object.entries(fixes).forEach(([key, fix]) => {
            console.log(`\n${key}:`);
            console.log(`  Problem: ${fix.problem}`);
            console.log(`  Solution: ${fix.solution}`);
          });
          
          console.log('\n📝 Manual review required for code fixes');
          EOF
          
          node scripts/e2e-healer.mjs
      
      - name: Check if fixes were applied
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "✅ Test fixes detected"
            echo "has_fixes=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No automatic fixes applied - manual intervention needed"
            echo "has_fixes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push fixes
        if: steps.analyze.outputs.has_fixes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@github.com"
          git config --local user.name "github-actions[bot]"
          git add e2e/
          git commit -m "fix(e2e): 🤖 Auto-healed failing E2E test locators [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push failed - may need manual review"
      
      - name: Create issue for manual E2E fixes
        if: steps.analyze.outputs.has_fixes != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const failureCount = ${{ needs.check-e2e-failures.outputs.failure_count }};
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🤖 E2E Test Failures Need Manual Fix (${failureCount} tests)`,
              body: `## E2E Test Failures Detected\n\nAutomated healing was unable to fix ${failureCount} E2E test failures.\n\n### What happened:\n- Test execution completed but found failures\n- Automated locator/timeout fixes may not apply to your scenario\n- Manual code review and updates required\n\n### Action needed:\n1. Review the test failure logs in the workflow run\n2. Update E2E test locators or add appropriate waits\n3. Push fixes to trigger new test run\n\nWorkflow run: ${context.payload.workflow_run.html_url}`,
              labels: ['e2e-tests', 'needs-manual-fix']
            });
      
      - name: Summary
        run: |
          echo "=========================================="
          echo "  E2E Auto-Healing Complete"
          echo "=========================================="
          echo "Failures detected: ${{ needs.check-e2e-failures.outputs.failure_count }}"
          echo "Status: Ready for verification"
