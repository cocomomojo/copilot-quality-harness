name: M2 Issue Intake

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue number in this repository
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  intake:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate dispatch input
        id: input
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          node --input-type=module -e '
            import { validateDispatchIssueNumber } from "./scripts/m2-validation.mjs";
            const result = validateDispatchIssueNumber(process.env.ISSUE_NUMBER);
            if (!result.valid) {
              console.error(result.error);
              process.exit(2);
            }
            process.stdout.write(`issue_number=${result.issueNumber}\n`);
          ' >> "$GITHUB_OUTPUT"
      - name: Fetch trusted same-repository issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.input.outputs.issue_number }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$RUNNER_TEMP/m2-issue.json"
      - name: Run read-only triage, repository analysis, and test design
        id: analyze
        env:
          ISSUE_NUMBER: ${{ steps.input.outputs.issue_number }}
          OUTPUT_FILE: ${{ runner.temp }}/m2-report.json
        run: |
          set +e
          node scripts/m2-validation.mjs \
            --github-issue "$RUNNER_TEMP/m2-issue.json" \
            --issue-number "$ISSUE_NUMBER" \
            --repository "$GITHUB_REPOSITORY" \
            --catalog qa/test-management/test-observation-catalog.yml \
            --root . \
            --output "$OUTPUT_FILE"
          result=$?
          echo "validation_exit_code=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" -eq 4 ]; then exit 4; fi
          exit 0
      - name: Run AI judgment with Copilot Skill
        if: always() && steps.analyze.outcome != 'skipped'
        id: ai-judgment
        env:
          REPORT_FILE: ${{ runner.temp }}/m2-report.json
          JUDGMENT_OUTPUT: ${{ runner.temp }}/judgment.json
        run: |
          set +e
          
          # Try to run Copilot Skill-based AI judgment
          copilot review --skill "m2-auto-judgment" \
            --input "$REPORT_FILE" \
            --format json \
            --output "$JUDGMENT_OUTPUT" 2>&1
          
          ai_result=$?
          if [ $ai_result -eq 0 ]; then
            echo "ai_judgment_success=true" >> "$GITHUB_OUTPUT"
            echo "✅ AI judgment completed via Copilot Skill"
          else
            echo "ai_judgment_success=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ AI judgment failed; will use rule-based fallback"
          fi
          exit 0
      - name: Run rule-based judgment as fallback
        if: always() && steps.analyze.outcome != 'skipped' && steps.ai-judgment.outputs.ai_judgment_success == 'false'
        id: fallback-judgment
        continue-on-error: true
        env:
          REPORT_FILE: ${{ runner.temp }}/m2-report.json
          JUDGMENT_OUTPUT: ${{ runner.temp }}/judgment.json
        run: |
          echo "⚠️ Using rule-based fallback judgment..."
          node scripts/m2-auto-judgment.mjs \
            --report "$REPORT_FILE" \
            --output "$JUDGMENT_OUTPUT" || true
          echo "✅ Fallback judgment completed"
      - name: Format M2 report as Markdown
        if: always() && steps.analyze.outcome != 'skipped'
        id: format-report
        env:
          REPORT_FILE: ${{ runner.temp }}/m2-report.json
          MARKDOWN_FILE: ${{ runner.temp }}/m2-report.md
          JUDGMENT_FILE: ${{ runner.temp }}/judgment.json
        run: |
          node scripts/format-m2-report.mjs \
            --input "$REPORT_FILE" \
            --output "$MARKDOWN_FILE"
          
          # Add judgment results to markdown if available
          if [ -f "$JUDGMENT_FILE" ]; then
            echo "" >> "$MARKDOWN_FILE"
            echo "---" >> "$MARKDOWN_FILE"
            echo "" >> "$MARKDOWN_FILE"
            echo "### AI 自動判定結果" >> "$MARKDOWN_FILE"
            echo "" >> "$MARKDOWN_FILE"
            node -e "
              const fs = require('fs');
              const judgment = JSON.parse(fs.readFileSync('$JUDGMENT_FILE', 'utf8'));
              console.log('| 項目 | 値 |');
              console.log('|------|-----|');
              console.log('| 判定レベル | \`' + judgment.level + '\` |');
              console.log('| 判定理由 | ' + (judgment.reason || 'N/A') + ' |');
              if (judgment.confidence) {
                console.log('| 確度 | ' + (judgment.confidence * 100).toFixed(1) + '% |');
              }
              if (judgment.factors && judgment.factors.length > 0) {
                console.log('| リスク要因 | ' + judgment.factors.join(', ') + ' |');
              }
            " >> "$MARKDOWN_FILE" 2>/dev/null || true
          fi
          
          echo "markdown_file=$MARKDOWN_FILE" >> "$GITHUB_OUTPUT"
      - name: Comment with AI judgment result
        if: always() && steps.analyze.outcome != 'skipped' && steps.format-report.outcome == 'success'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.input.outputs.issue_number }}
          REPORT_FILE: ${{ runner.temp }}/m2-report.json
          MARKDOWN_FILE: ${{ steps.format-report.outputs.markdown_file }}
          JUDGMENT_FILE: ${{ runner.temp }}/judgment.json
        with:
          script: |
            const fs = require('node:fs');
            if (!fs.existsSync(process.env.REPORT_FILE)) {
              core.warning('No M2 report was produced; no Issue comment was posted.');
              return;
            }
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, 'utf8'));
            if (report.sourceTrust?.verified !== true) {
              core.warning('Issue source was not verified; no Issue comment was posted.');
              return;
            }
            
            // Load AI judgment if available
            let judgment = null;
            let aiStatus = 'なし';
            if (fs.existsSync(process.env.JUDGMENT_FILE)) {
              try {
                judgment = JSON.parse(fs.readFileSync(process.env.JUDGMENT_FILE, 'utf8'));
                aiStatus = judgment.level || '判定失敗';
              } catch (e) {
                core.warning('Failed to parse judgment file');
              }
            }
            
            const statusText = {
              'safe-proceed': '✅ 自動化可能',
              'unsafe-stop': '⚠️ 停止中',
              'ready-for-human-review': '👤 人間レビュー待機中',
              'needs-approval': '⚠️ 確認待機中',
              'manual-only': '❌ 手動判断が必須'
            }[report.status] || report.status;
            
            const lines = [
              `## M2 自動化ワークフロー: ${statusText}`,
              '',
              `Issue: #${report.sourceTrust.issueNumber}`,
              `ソース: \`${report.sourceTrust.repository}\` (検証済み)`,
              `AIモデル呼び出し: ${aiStatus}`,
              'ソース書き込み、ブランチ作成、PR作成: なし',
              `レポートアーティファクト: [M2 実行結果](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ''
            ];
            
            // Add AI judgment details if available
            if (judgment) {
              lines.push('### 🤖 AI 自動判定結果');
              lines.push('');
              lines.push(`**判定レベル**: \`${judgment.level}\``);
              lines.push(`**判定理由**: ${judgment.reason || 'N/A'}`);
              if (judgment.confidence !== undefined) {
                lines.push(`**確度**: ${(judgment.confidence * 100).toFixed(1)}%`);
              }
              if (judgment.factors && judgment.factors.length > 0) {
                lines.push(`**検出されたリスク要因**: ${judgment.factors.join(', ')}`);
              }
              if (judgment.recommendation) {
                lines.push('');
                lines.push(`**推奨アクション**:`);
                lines.push(judgment.recommendation);
              }
              lines.push('');
            }
            
            const reasons = report.stopConditions ?? report.errors ?? [];
            if (reasons.length) {
              lines.push('停止理由:');
              reasons.forEach((reason) => {
                const ja = {
                  'missing information: acceptance criteria, test requirements, allowed scope, severity': '不足情報: 受入条件、テスト要求、影響範囲、重大度',
                  'missing information: acceptance criteria, test requirements, allowed scope': '不足情報: 受入条件、テスト要求、影響範囲',
                  'missing information: acceptance criteria, test requirements': '不足情報: 受入条件、テスト要求',
                  'read-only automation has not been approved for this issue': '読み取り専用自動化がこのIssueで承認されていません',
                  'issue mentions a restricted security, personal-data, payment, or destructive-database scope': 'Issueが制限対象のキーワード（セキュリティ、個人情報、決済、破壊的DB操作）を含んでいます'
                }[reason];
                lines.push(`- ${ja || reason}`);
              });
              lines.push('');
            }
            
            if (report.handoff) {
              lines.push(`推奨ブランチ: \`${report.handoff.suggestedBranch}\``);
              lines.push('このワークフロー内での実装実行は許可されていません。アーティファクトをレビューして、実装判断は手動で行ってください。');
              lines.push('');
            }
            
            // フォーマット済みレポートを追記
            if (fs.existsSync(process.env.MARKDOWN_FILE)) {
              const markdown = fs.readFileSync(process.env.MARKDOWN_FILE, 'utf8');
              lines.push('---');
              lines.push('');
              lines.push(markdown);
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: lines.join('\n')
            });
      - name: Upload M2 report and judgment artifacts
        if: always() && steps.analyze.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: m2-issue-${{ steps.input.outputs.issue_number }}-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m2-report.json
            ${{ runner.temp }}/judgment.json
          if-no-files-found: warn
          retention-days: 14
