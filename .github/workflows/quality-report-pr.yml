name: Quality Report PR

on:
  workflow_run:
    workflows: ["Test Matrix"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  download-artifacts:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Download test matrix results
        id: download
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          workflow: test-matrix.yml
          run_id: ${{ github.event.workflow_run.id }}
          path: artifacts
          name_is_regexp: true
          name: 'test-results-.*|test-matrix-summary|coverage-report-.*'
      
      - name: Verify artifacts were downloaded
        run: |
          if [ ! -d "artifacts" ] || [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "❌ ERROR: No artifacts found for workflow run ${{ github.event.workflow_run.id }}"
            echo "Downloading list of available artifacts..."
            gh run view ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} --json artifacts || true
            exit 1
          fi
          echo "✅ Artifacts downloaded successfully"
          ls -la artifacts/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts for next job
        uses: actions/upload-artifact@v4
        with:
          name: merged-test-results
          path: artifacts/
          retention-days: 1

  generate-quality-report:
    runs-on: ubuntu-latest
    needs: download-artifacts
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Install dependencies
        run: npm install
      
      - name: Download merged results
        uses: actions/download-artifact@v4
        with:
          name: merged-test-results
          path: test-results-data
      
      - name: Verify merged results were downloaded
        run: |
          if [ ! -d "test-results-data" ] || [ -z "$(ls -A test-results-data 2>/dev/null)" ]; then
            echo "❌ ERROR: No merged test results found"
            echo "Current directory contents:"
            ls -la
            exit 1
          fi
          echo "✅ Merged results downloaded"
          echo "Contents of test-results-data:"
          find test-results-data -type f -exec echo "  - {}" \;
      
      - name: Generate quality report
        id: quality_report
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const yaml = require('js-yaml');
          
          const resultsDir = 'test-results-data';
          const results = {};
          let matrixSummary = null;
          const coverageThresholds = { lines: 80, branches: 75, functions: 80 };
          const coverage = {
            overall: null,
            files: []
          };
          const traceability = {
            perspective_count: 0,
            quality_items_count: 0,
            perspectives_file: null,
            test_items_file: null,
            perspectives_excerpt: [],
            quality_items_excerpt: [],
            spec_issue_mapping: []
          };
          
          // Parse all JSON files
          function readJsonFiles(dir, prefix = '') {
            try {
              if (!fs.existsSync(dir)) return;
              for (const file of fs.readdirSync(dir)) {
                const filePath = path.join(dir, file);
                const stat = fs.statSync(filePath);
                
                if (stat.isDirectory()) {
                  readJsonFiles(filePath, prefix + file + '/');
                } else if (file === 'test-matrix-summary.json') {
                  matrixSummary = JSON.parse(fs.readFileSync(filePath, 'utf-8'));
                } else if (file.endsWith('.json') && file.includes('test-result')) {
                  const data = JSON.parse(fs.readFileSync(filePath, 'utf-8'));
                  const key = `node${data.node_version}-${data.test_type}`;
                  results[key] = data;
                }
              }
            } catch (e) {
              console.error('Error reading results:', e.message);
            }
          }
          
          readJsonFiles(resultsDir);

          function toPercent(covered, total) {
            if (!total || total === 0) return 100;
            return Math.round((covered / total) * 10000) / 100;
          }

          function normalizeCoveragePath(filePath) {
            if (!filePath) return filePath;
            const cwd = process.cwd();
            let normalized = filePath.replace(/\\/g, '/');
            if (normalized.startsWith(`${cwd}/`)) {
              normalized = normalized.slice(cwd.length + 1);
            }
            normalized = normalized.replace(/^\/+/, '');

            if (fs.existsSync(normalized)) return normalized;
            if (normalized.startsWith('src/')) {
              const backendPath = `backend/${normalized}`;
              const frontendPath = `frontend/${normalized}`;
              if (fs.existsSync(backendPath)) return backendPath;
              if (fs.existsSync(frontendPath)) return frontendPath;
            }
            return normalized;
          }

          function computeCoverageFromFinal(coverageFinal) {
            const rows = [];
            for (const [filePath, item] of Object.entries(coverageFinal || {})) {
              if (!item) continue;
              const statementTotals = Object.values(item.s || {});
              const statementsTotal = statementTotals.length;
              const statementsCovered = statementTotals.filter((count) => count > 0).length;
              const functionTotals = Object.values(item.f || {});
              const functionsTotal = functionTotals.length;
              const functionsCovered = functionTotals.filter((count) => count > 0).length;
              const branchTotals = Object.values(item.b || {}).flat();
              const branchesTotal = branchTotals.length;
              const branchesCovered = branchTotals.filter((count) => count > 0).length;

              rows.push({
                file: normalizeCoveragePath(filePath),
                lines: {
                  covered: statementsCovered,
                  total: statementsTotal,
                  pct: toPercent(statementsCovered, statementsTotal)
                },
                branches: {
                  covered: branchesCovered,
                  total: branchesTotal,
                  pct: toPercent(branchesCovered, branchesTotal)
                },
                functions: {
                  covered: functionsCovered,
                  total: functionsTotal,
                  pct: toPercent(functionsCovered, functionsTotal)
                }
              });
            }
            return rows;
          }

          function resolveCoverage() {
            const coverageRows = new Map();
            function upsertCoverageRow(row) {
              if (!row || !row.file) return;
              coverageRows.set(row.file, row);
            }

            function readCoverageFiles(dir) {
              if (!fs.existsSync(dir)) return;
              for (const file of fs.readdirSync(dir)) {
                const filePath = path.join(dir, file);
                const stat = fs.statSync(filePath);
                if (stat.isDirectory()) {
                  readCoverageFiles(filePath);
                  continue;
                }
                if (file === 'coverage-summary.json') {
                  try {
                    const data = JSON.parse(fs.readFileSync(filePath, 'utf-8'));
                    for (const [targetPath, value] of Object.entries(data || {})) {
                      if (targetPath === 'total' || !value?.lines) continue;
                      upsertCoverageRow({
                        file: normalizeCoveragePath(targetPath),
                        lines: value.lines,
                        branches: value.branches,
                        functions: value.functions
                      });
                    }
                  } catch (e) {
                    console.warn('Could not parse coverage-summary.json:', e.message);
                  }
                } else if (file === 'coverage-final.json') {
                  try {
                    const data = JSON.parse(fs.readFileSync(filePath, 'utf-8'));
                    for (const row of computeCoverageFromFinal(data)) {
                      upsertCoverageRow(row);
                    }
                  } catch (e) {
                    console.warn('Could not parse coverage-final.json:', e.message);
                  }
                }
              }
            }

            readCoverageFiles(resultsDir);

            const mergedFiles = [...coverageRows.values()].map((row) => {
              const linesPct = row.lines?.pct ?? 0;
              const branchesPct = row.branches?.pct ?? 0;
              const functionsPct = row.functions?.pct ?? 0;
              const passed = linesPct >= coverageThresholds.lines
                && branchesPct >= coverageThresholds.branches
                && functionsPct >= coverageThresholds.functions;
              return {
                path: row.file,
                lines_pct: linesPct,
                branches_pct: branchesPct,
                functions_pct: functionsPct,
                status: passed ? 'pass' : 'fail'
              };
            });

            mergedFiles.sort((a, b) => {
              if (a.status !== b.status) return a.status === 'fail' ? -1 : 1;
              return a.path.localeCompare(b.path);
            });

            const totals = {
              lines: { covered: 0, total: 0 },
              branches: { covered: 0, total: 0 },
              functions: { covered: 0, total: 0 }
            };
            for (const row of [...coverageRows.values()]) {
              totals.lines.covered += row.lines?.covered || 0;
              totals.lines.total += row.lines?.total || 0;
              totals.branches.covered += row.branches?.covered || 0;
              totals.branches.total += row.branches?.total || 0;
              totals.functions.covered += row.functions?.covered || 0;
              totals.functions.total += row.functions?.total || 0;
            }

            coverage.overall = {
              lines_pct: toPercent(totals.lines.covered, totals.lines.total),
              branches_pct: toPercent(totals.branches.covered, totals.branches.total),
              functions_pct: toPercent(totals.functions.covered, totals.functions.total),
              status:
                toPercent(totals.lines.covered, totals.lines.total) >= coverageThresholds.lines
                && toPercent(totals.branches.covered, totals.branches.total) >= coverageThresholds.branches
                && toPercent(totals.functions.covered, totals.functions.total) >= coverageThresholds.functions
                  ? 'pass'
                  : 'fail'
            };
            coverage.files = mergedFiles;
            coverage.non_pass_count = mergedFiles.filter((row) => row.status !== 'pass').length;
            coverage.thresholds = coverageThresholds;
          }

          resolveCoverage();

          function resolveTraceability() {
            const generatedDir = 'qa/quality-characteristics/generated';
            if (fs.existsSync(generatedDir)) {
              for (const file of fs.readdirSync(generatedDir)) {
                const fullPath = path.join(generatedDir, file);
                if (!fs.statSync(fullPath).isFile()) continue;
                if (file.startsWith('test-perspectives-') && file.endsWith('.json')) {
                  try {
                    const data = JSON.parse(fs.readFileSync(fullPath, 'utf-8'));
                    traceability.perspective_count = data.testPerspectives?.length || 0;
                    traceability.perspectives_file = `qa/quality-characteristics/generated/${file}`;
                    traceability.perspectives_excerpt = (data.testPerspectives || []).slice(0, 8).map((perspective) => ({
                      characteristic_id: perspective.characteristic_id,
                      characteristic_name: perspective.characteristic_name,
                      test_perspectives: (perspective.test_perspectives || []).slice(0, 4)
                    }));
                  } catch (e) {
                    console.warn('Could not parse test perspectives JSON:', e.message);
                  }
                }
                if (file.startsWith('test-items-') && file.endsWith('.json')) {
                  try {
                    const data = JSON.parse(fs.readFileSync(fullPath, 'utf-8'));
                    traceability.quality_items_count = data.testItems?.length || 0;
                    traceability.test_items_file = `qa/quality-characteristics/generated/${file}`;
                    traceability.quality_items_excerpt = (data.testItems || []).slice(0, 12).map((item) => ({
                      id: item.id,
                      perspective: item.perspective,
                      description: item.description
                    }));
                  } catch (e) {
                    console.warn('Could not parse test items JSON:', e.message);
                  }
                }
              }
            }

            const specsDir = 'tests/specs';
            if (!fs.existsSync(specsDir)) return;
            for (const specFile of fs.readdirSync(specsDir)) {
              if (!specFile.endsWith('.yml') && !specFile.endsWith('.yaml')) continue;
              const fullPath = path.join(specsDir, specFile);
              const content = fs.readFileSync(fullPath, 'utf-8');
              const issueMatches = [...content.matchAll(/#\s*Issue:\s*Closes\s+#(\d+)/gi)];
              if (issueMatches.length === 0) continue;

              let specObject = {};
              try {
                specObject = yaml.load(content) || {};
              } catch (e) {
                console.warn(`Could not parse spec YAML (${specFile}):`, e.message);
              }

              const testSpec = specObject.test_spec || {};
              const utCases = Array.isArray(testSpec.ut) ? testSpec.ut : [];
              const e2eCases = Array.isArray(testSpec.e2e) ? testSpec.e2e : [];
              for (const issueMatch of issueMatches) {
                traceability.spec_issue_mapping.push({
                  issue: Number(issueMatch[1]),
                  spec_file: `tests/specs/${specFile}`,
                  feature: testSpec.feature || specFile,
                  ut_cases: utCases.length,
                  e2e_cases: e2eCases.length,
                  ut_details: utCases.slice(0, 6).map((item) => ({
                    id: item.id,
                    title: item.title
                  })),
                  e2e_details: e2eCases.slice(0, 6).map((item) => ({
                    id: item.id,
                    title: item.title
                  }))
                });
              }
            }
          }

          resolveTraceability();
          
          // Create markdown table
          const rows = [];
          rows.push('| Node Version | Unit Tests | API Tests | E2E Tests | Advanced Tests |');
          rows.push('|---|---|---|---|---|');
          
          const nodeVersions = [20];
          for (const nodeVer of nodeVersions) {
            const row = [`Node ${nodeVer}`];
            
            for (const testType of ['unit', 'api', 'e2e', 'advanced']) {
              const key = `node${nodeVer}-${testType}`;
              if (results[key]) {
                const r = results[key];
                const emoji = r.status === 'passed' ? '✅' : '❌';
                row.push(`${emoji} ${r.passed}P/${r.failed}F`);
              } else {
                row.push('⏭️ N/A');
              }
            }
            
            rows.push('| ' + row.join(' | ') + ' |');
          }
          
          const table = rows.join('\n');
          console.log('Generated quality table:\n' + table);
          
          // Calculate summary
          const allPassed = Object.values(results).length > 0 && Object.values(results).every(r => r.status === 'passed' || r.status === 'unknown');
          const totalTests = matrixSummary?.total_tests ?? Object.values(results).reduce((sum, r) => sum + r.passed + r.failed, 0);
          const totalPassed = matrixSummary?.total_passed ?? Object.values(results).reduce((sum, r) => sum + r.passed, 0);
          const totalFailed = matrixSummary?.total_failed ?? (totalTests - totalPassed);
          const passRate = totalTests > 0 ? Math.round((totalPassed / totalTests) * 100) : 100;
          
          fs.writeFileSync('quality-report-table.md', table);
          fs.writeFileSync('quality-report-summary.json', JSON.stringify({
            all_passed: allPassed,
            pass_rate: passRate,
            total_tests: totalTests,
            total_passed: totalPassed,
            total_failed: totalFailed,
            table: table,
            matrix_summary: matrixSummary,
            coverage,
            traceability,
            timestamp: new Date().toISOString()
          }, null, 2));
          
          // Output to GITHUB_OUTPUT instead of deprecated set-output
          const output = `pass_rate=${passRate}\nall_passed=${allPassed}\n`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, output);
          
          console.log('Summary:', { all_passed: allPassed, pass_rate: passRate });
          EOF
      
      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-data
          path: quality-report-summary.json
          retention-days: 5

  post-pr-comment:
    runs-on: ubuntu-latest
    needs: generate-quality-report
    if: github.event.workflow_run.event == 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Find PR
        id: find_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --search "head:${{ github.event.workflow_run.head_branch }}" --json number --jq ".[0].number" || echo "")
          if [ -z "$PR_NUMBER" ]; then
            echo "Could not find PR for branch: ${{ github.event.workflow_run.head_branch }}"
            echo "pr_number=" >> $GITHUB_OUTPUT
          else
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi
      
      - name: Download quality report
        if: steps.find_pr.outputs.pr_number
        uses: actions/download-artifact@v4
        with:
          name: quality-report-data
          path: report-data
      
      - name: Post quality report to PR
        if: steps.find_pr.outputs.pr_number
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'report-data/quality-report-summary.json';
            const prNumber = Number('${{ steps.find_pr.outputs.pr_number }}');
            
            let summary = { 
              all_passed: false, 
              pass_rate: 0, 
              total_tests: 0,
              total_passed: 0,
              total_failed: 0,
              table: '',
              coverage: {
                overall: null,
                files: [],
                non_pass_count: 0,
                thresholds: { lines: 80, branches: 75, functions: 80 }
              },
              traceability: {
                perspective_count: 0,
                quality_items_count: 0,
                perspectives_file: null,
                test_items_file: null,
                perspectives_excerpt: [],
                quality_items_excerpt: [],
                spec_issue_mapping: []
              }
            };
            try {
              if (fs.existsSync(reportPath)) {
                summary = JSON.parse(fs.readFileSync(reportPath, 'utf-8'));
              }
            } catch (e) {
              console.error('Could not read report:', e.message);
            }
            
            const statusEmoji = summary.all_passed ? '✅' : '⚠️';
            const body = [];
            body.push('## 📊 Quality Report');
            body.push('');
            body.push(`${statusEmoji} **Pass Rate**: ${summary.pass_rate}% (${summary.total_passed}/${summary.total_tests} tests)`);
            body.push('');
            body.push('### Test Results by Matrix');
            body.push('');
            const headSha = context.payload.workflow_run?.head_sha || context.sha;
            const toBlobLink = (filePath) =>
              `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${headSha}/${filePath}`;
            if (summary.table) {
              body.push(summary.table);
            } else {
              body.push('| Node Version | Unit Tests | API Tests | E2E Tests | Advanced Tests |');
              body.push('|---|---|---|---|---|');
              body.push('| Node 20 | ⏳ No data | ⏳ No data | ⏳ No data | ⏳ No data |');
            }
            body.push('');
            body.push('### 📈 Coverage Details');
            const coverageOverall = summary.coverage?.overall;
            const coverageThresholds = summary.coverage?.thresholds || { lines: 80, branches: 75, functions: 80 };
            if (coverageOverall) {
              const coverageOverallEmoji = coverageOverall.status === 'pass' ? '✅' : '⚠️';
              body.push(`${coverageOverallEmoji} Overall coverage: lines ${coverageOverall.lines_pct}% / branches ${coverageOverall.branches_pct}% / functions ${coverageOverall.functions_pct}%`);
              body.push(`Thresholds: lines >= ${coverageThresholds.lines}%, branches >= ${coverageThresholds.branches}%, functions >= ${coverageThresholds.functions}%`);
            } else {
              body.push('⏭️ Coverage data not found');
            }
            body.push('');
            if ((summary.coverage?.files || []).length > 0) {
              body.push('| File | Lines | Branches | Functions | Status |');
              body.push('|---|---:|---:|---:|---|');
              for (const row of summary.coverage.files.slice(0, 20)) {
                const statusIcon = row.status === 'pass' ? '✅ PASS' : '❌ FAIL';
                body.push(`| [\`${row.path}\`](${toBlobLink(row.path)}) | ${row.lines_pct}% | ${row.branches_pct}% | ${row.functions_pct}% | ${statusIcon} |`);
              }
              if (summary.coverage.files.length > 20) {
                body.push(`| ... | ... | ... | ... | ...and ${summary.coverage.files.length - 20} more files |`);
              }
              if ((summary.coverage.non_pass_count || 0) > 0) {
                body.push('');
                body.push(`Non-pass coverage files: **${summary.coverage.non_pass_count}**`);
              }
            }
            body.push('');
            body.push('### 🔗 Issue Traceability');
            body.push('');

            let linkedIssues = [];
            let implementationFiles = [];
            try {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              const issueMatches = `${pr.data.body || ''}`.match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi) || [];
              linkedIssues = issueMatches.map((match) => Number(match.match(/#(\d+)/)?.[1])).filter(Boolean);
              linkedIssues = [...new Set(linkedIssues)];
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100
              });
              implementationFiles = files.map((file) => file.filename);
            } catch (e) {
              console.error('Could not fetch PR details for traceability:', e.message);
            }

            const issueCases = new Map();
            for (const mapping of summary.traceability?.spec_issue_mapping || []) {
              if (!mapping?.issue) continue;
              const key = Number(mapping.issue);
              const current = issueCases.get(key) || { ut: 0, e2e: 0, specs: [], utDetails: [], e2eDetails: [] };
              current.ut += Number(mapping.ut_cases || 0);
              current.e2e += Number(mapping.e2e_cases || 0);
              if (mapping.spec_file) {
                current.specs.push({
                  path: mapping.spec_file,
                  feature: mapping.feature || mapping.spec_file
                });
              }
              current.utDetails.push(...(mapping.ut_details || []));
              current.e2eDetails.push(...(mapping.e2e_details || []));
              issueCases.set(key, current);
            }

            const reportIssues = linkedIssues.length > 0
              ? linkedIssues
              : [...issueCases.keys()];

            body.push('| Issue | テスト観点 | テスト項目 | 実装 | テスト実行 |');
            body.push('|---|---|---|---|---|');
            const perspectiveLabel = summary.traceability?.perspectives_file
              ? `${summary.traceability?.perspective_count || 0} perspectives ([detail](${toBlobLink(summary.traceability.perspectives_file)}))`
              : `${summary.traceability?.perspective_count || 0} perspectives`;
            const qualityItemsLabel = summary.traceability?.test_items_file
              ? `${summary.traceability?.quality_items_count || 0} items ([detail](${toBlobLink(summary.traceability.test_items_file)}))`
              : `${summary.traceability?.quality_items_count || 0} items`;

            if (reportIssues.length === 0) {
              body.push(`| _未紐付け_ | ${perspectiveLabel} | ${qualityItemsLabel} | ${implementationFiles.length} files changed in PR | Pass rate ${summary.pass_rate}% (${summary.total_passed}/${summary.total_tests}) |`);
            } else {
              for (const issueNo of reportIssues) {
                const issueData = issueCases.get(issueNo) || { ut: 0, e2e: 0, specs: [], utDetails: [], e2eDetails: [] };
                const specLabel = issueData.specs.length > 0
                  ? issueData.specs.slice(0, 2).map((spec) => `[${spec.feature}](${toBlobLink(spec.path)})`).join(', ')
                  : 'spec not detected';
                const itemLabel = `UT ${issueData.ut} / E2E ${issueData.e2e}, ${qualityItemsLabel}`;
                body.push(`| #${issueNo} | ${perspectiveLabel} | ${itemLabel}<br/>${specLabel} | ${implementationFiles.length} files changed in PR | Pass rate ${summary.pass_rate}% (${summary.total_passed}/${summary.total_tests}) |`);
              }
            }

            if ((summary.traceability?.perspectives_excerpt || []).length > 0) {
              body.push('');
              body.push('#### テスト観点（具体・抜粋）');
              for (const perspective of summary.traceability.perspectives_excerpt) {
                const sub = (perspective.test_perspectives || []).join(', ');
                body.push(`- **${perspective.characteristic_name}**: ${sub}`);
              }
            }

            if ((summary.traceability?.quality_items_excerpt || []).length > 0) {
              body.push('');
              body.push('#### テスト項目（具体・抜粋）');
              for (const item of summary.traceability.quality_items_excerpt.slice(0, 10)) {
                body.push(`- \`${item.id}\` (${item.perspective}): ${item.description}`);
              }
              if (summary.traceability.quality_items_excerpt.length > 10) {
                body.push(`- ...and ${summary.traceability.quality_items_excerpt.length - 10} more items in excerpt`);
              }
            }

            if (reportIssues.length > 0) {
              body.push('');
              body.push('#### Issue別UT/E2E詳細（抜粋）');
              for (const issueNo of reportIssues) {
                const issueData = issueCases.get(issueNo) || { utDetails: [], e2eDetails: [], specs: [] };
                body.push(`- **#${issueNo}**`);
                const specLinks = issueData.specs.slice(0, 3).map((spec) => `[${spec.path}](${toBlobLink(spec.path)})`);
                if (specLinks.length > 0) {
                  body.push(`  - Specs: ${specLinks.join(', ')}`);
                }
                if (issueData.utDetails.length > 0) {
                  const utLines = issueData.utDetails.slice(0, 4).map((t) => `\`${t.id}\` ${t.title}`);
                  body.push(`  - UT: ${utLines.join(' / ')}`);
                }
                if (issueData.e2eDetails.length > 0) {
                  const e2eLines = issueData.e2eDetails.slice(0, 4).map((t) => `\`${t.id}\` ${t.title}`);
                  body.push(`  - E2E: ${e2eLines.join(' / ')}`);
                }
              }
            }

            if (implementationFiles.length > 0) {
              body.push('');
              body.push(`Implementation files (${implementationFiles.length}):`);
              for (const file of implementationFiles.slice(0, 8)) {
                body.push(`- [\`${file}\`](${toBlobLink(file)})`);
              }
              if (implementationFiles.length > 8) {
                body.push(`- ...and ${implementationFiles.length - 8} more files`);
              }
            }
            body.push('');
            body.push('---');
            body.push(`_Report generated at ${summary.timestamp || new Date().toISOString()}_`);
            
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body.join('\n')
              });
              console.log(`Posted quality report to PR #${prNumber}`);
            } catch (e) {
              console.error('Could not post comment:', e.message);
            }
