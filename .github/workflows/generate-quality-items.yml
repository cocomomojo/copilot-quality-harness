name: Generate Quality Items

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "テスト項目の生成モード"
        required: true
        default: "simple"
        type: choice
        options:
          - simple
          - detailed

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-quality-items:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Install dependencies
        run: npm install
      
      - name: Generate quality characteristics (テスト観点・項目の生成)
        id: generate
        run: |
          mkdir -p qa/quality-characteristics/generated
          npx ts-node scripts/generate-quality-characteristics.ts "${{ github.event.inputs.mode }}" "qa/quality-characteristics/generated"
      
      - name: Create branch and commit changes
        id: commit
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Create feature branch
          BRANCH_NAME="feature/quality-items-${{ github.event.inputs.mode }}-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          
          # Add generated files
          git add qa/quality-characteristics/generated/
          
          # Commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "branch_name=" >> $GITHUB_OUTPUT
          else
            git commit -m "🧪 Generate ${{ github.event.inputs.mode }} mode quality test items (ISO/IEC 25010)"
            git push origin "$BRANCH_NAME"
            echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          fi
      
      - name: Create pull request
        if: steps.commit.outputs.branch_name != ''
        run: |
          gh pr create \
            --title "Generate ${{ github.event.inputs.mode }} mode quality test items" \
            --body "## Quality Items Generation\n\nMode: ${{ github.event.inputs.mode }}\n\n### Generated Files\n- Test perspectives (JSON)\n- Test items (YAML)\n- Test items (JSON)\n\n### Statistics\n- Simple mode: 6-10 items per characteristic\n- Detailed mode: 15-25 items per characteristic" \
            --head "${{ steps.commit.outputs.branch_name }}" \
            --base main \
            --label "automated,quality,test-generation"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-items-${{ github.event.inputs.mode }}
          path: qa/quality-characteristics/generated/
          retention-days: 30
      
      - name: Summary
        run: |
          echo "## ✅ Quality Items Generation Complete"
          echo ""
          echo "**Mode**: ${{ github.event.inputs.mode }}"
          echo "**Generated Files**:"
          echo "- Test perspectives sheet (JSON)"
          echo "- Test items (YAML)"
          echo "- Test items (JSON)"
          echo ""
          if [ -n "${{ steps.commit.outputs.branch_name }}" ]; then
            echo "**Pull Request**: Created from branch \`${{ steps.commit.outputs.branch_name }}\`"
            echo "- Visit https://github.com/${{ github.repository }}/compare/${{ steps.commit.outputs.branch_name }} to view and create a PR"
          else
            echo "⚠️ No changes were made - no files were generated"
          fi
          echo ""
          echo "All generated files available in artifacts section."
