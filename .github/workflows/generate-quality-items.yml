name: Generate Quality Items

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "テスト項目の生成モード"
        required: true
        default: "simple"
        type: choice
        options:
          - simple
          - detailed

permissions:
  contents: write
  pull-requests: write
  actions: read

outputs:
  quality_items_artifact:
    description: "生成された品質項目アーティファクト名"
    value: ${{ jobs.generate-quality-items.outputs.artifact_name }}
  quality_items_manifest:
    description: "品質項目マニフェストファイルパス"
    value: ${{ jobs.generate-quality-items.outputs.manifest_file }}

jobs:
  generate-quality-items:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: quality-items-${{ github.event.inputs.mode }}
      manifest_file: qa/quality-characteristics/generated/manifest.json
      spec_file: qa/quality-characteristics/generated/test-items-${{ github.event.inputs.mode }}.yml
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Install dependencies
        run: npm install
      
      - name: Generate quality characteristics (テスト観点・項目の生成)
        id: generate
        run: |
          mkdir -p qa/quality-characteristics/generated
          npx ts-node scripts/generate-quality-characteristics.ts "${{ github.event.inputs.mode }}" "qa/quality-characteristics/generated"
      
      - name: Generate metadata and manifest
        id: metadata
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          WORKFLOW_RUN_ID=${{ github.run_id }}
          MODE="${{ github.event.inputs.mode }}"
          
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "workflow_run_id=$WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"
          
          # Create manifest.json for artifact tracking
          cat > qa/quality-characteristics/generated/manifest.json << EOF
          {
            "version": "1.0",
            "generated_at": "$TIMESTAMP",
            "workflow_run_id": $WORKFLOW_RUN_ID,
            "mode": "$MODE",
            "files": {
              "test_perspectives": "test-perspectives-${MODE}.json",
              "test_items_yaml": "test-items-${MODE}.yml",
              "test_items_json": "test-items-${MODE}.json"
            },
            "artifact_name": "quality-items-${MODE}",
            "github_run_url": "https://github.com/${{ github.repository }}/actions/runs/$WORKFLOW_RUN_ID"
          }
          EOF
          
          echo "Manifest created at: qa/quality-characteristics/generated/manifest.json"
      
      - name: Create branch and commit changes
        id: commit
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Create feature branch
          BRANCH_NAME="feature/quality-items-${{ github.event.inputs.mode }}-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          
          # Add generated files
          git add qa/quality-characteristics/generated/
          
          # Commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "branch_name=" >> $GITHUB_OUTPUT
          else
            git commit -m "🧪 Generate ${{ github.event.inputs.mode }} mode quality test items (ISO/IEC 25010)"
            git push origin "$BRANCH_NAME"
            echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          fi
      
      - name: Publish artifact metadata
        run: |
          echo "## 📦 Artifact Published"
          echo ""
          echo "**Artifact Name**: quality-items-${{ github.event.inputs.mode }}"
          echo "**Workflow Run**: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "**Manifest**: qa/quality-characteristics/generated/manifest.json"
          echo ""
          echo "### Files in Artifact:"
          echo "- \`test-perspectives-${{ github.event.inputs.mode }}.json\`"
          echo "- \`test-items-${{ github.event.inputs.mode }}.yml\`"
          echo "- \`test-items-${{ github.event.inputs.mode }}.json\`"
          echo "- \`manifest.json\`"
          echo ""
          echo "### Usage in Next Workflow:"
          echo "To use this artifact in another workflow:"
          echo "\`\`\`bash"
          echo "gh run download ${{ github.run_id }} --name quality-items-${{ github.event.inputs.mode }}"
          echo "\`\`\`"
      
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-items-${{ github.event.inputs.mode }}
          path: qa/quality-characteristics/generated/
          retention-days: 30
          if-no-files-found: error
      
      - name: Summary
        run: |
          echo "## ✅ Quality Items Generation Complete"
          echo ""
          echo "**Mode**: ${{ github.event.inputs.mode }}"
          echo "**Timestamp**: $(cat qa/quality-characteristics/generated/manifest.json | grep -o '"generated_at": "[^"]*"')"
          echo ""
          echo "### Generated Files:"
          echo "- Test perspectives sheet (JSON)"
          echo "- Test items (YAML)"
          echo "- Test items (JSON)"
          echo "- Manifest (JSON)"
          echo ""
          if [ -n "${{ steps.commit.outputs.branch_name }}" ]; then
            echo "**Git Branch**: \`${{ steps.commit.outputs.branch_name }}\`"
            echo "**PR Link**: https://github.com/${{ github.repository }}/compare/${{ steps.commit.outputs.branch_name }}"
          else
            echo "⚠️ No changes were made - no files were generated"
          fi
          echo ""
          echo "### Artifact Storage:"
          echo "✅ All files stored in artifact: \`quality-items-${{ github.event.inputs.mode }}\`"
          echo "✅ Manifest for tracking: \`manifest.json\`"
          echo "✅ Retention period: 30 days"
