name: Test Coverage Analysis

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  analyze-coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      
      - name: Install dependencies
        run: npm install
      
      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: npm test 2>&1 | tee /tmp/unit-tests-${{ matrix.node-version }}.log
      
      - name: Run API tests
        id: api_tests
        continue-on-error: true
        run: npm run test:api 2>&1 | tee /tmp/api-tests-${{ matrix.node-version }}.log
      
      - name: Run advanced tests
        id: advanced_tests
        continue-on-error: true
        run: npm run test:advanced 2>&1 | tee /tmp/advanced-tests-${{ matrix.node-version }}.log
      
      - name: Analyze test coverage gaps
        id: coverage_analysis
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          
          const nodeVersion = '${{ matrix.node-version }}';
          const logs = {
            unit: '/tmp/unit-tests-' + nodeVersion + '.log',
            api: '/tmp/api-tests-' + nodeVersion + '.log',
            advanced: '/tmp/advanced-tests-' + nodeVersion + '.log'
          };
          
          const stats = {
            node_version: nodeVersion,
            timestamp: new Date().toISOString(),
            test_results: {},
            total_suites: 0,
            total_tests: 0,
            coverage_score: 0
          };
          
          for (const [type, logFile] of Object.entries(logs)) {
            if (fs.existsSync(logFile)) {
              const content = fs.readFileSync(logFile, 'utf-8');
              
              // Match Vitest format (modern)
              const vitestPass = content.match(/✓\s+(\d+)\s+passed/);
              const vitestFail = content.match(/✖\s+(\d+)\s+failed/);
              
              // Match Mocha format (legacy)
              const mochaPass = content.match(/(\d+)\s+passing/);
              const mochaFail = content.match(/(\d+)\s+failing/);
              
              stats.test_results[type] = {
                passed: vitestPass ? parseInt(vitestPass[1]) : (mochaPass ? parseInt(mochaPass[1]) : 0),
                failed: vitestFail ? parseInt(vitestFail[1]) : (mochaFail ? parseInt(mochaFail[1]) : 0),
                skipped: 0
              };
              
              stats.total_tests += stats.test_results[type].passed + stats.test_results[type].failed;
            }
          }
          
          if (stats.total_tests > 0) {
            const totalPassed = Object.values(stats.test_results).reduce((sum, r) => sum + r.passed, 0);
            stats.coverage_score = Math.round((totalPassed / stats.total_tests) * 100);
          }
          
          const gapScore = 100 - stats.coverage_score;
          const criticalGaps = gapScore > 10 ? 'yes' : 'no';
          
          // Write output using GITHUB_OUTPUT instead of deprecated set-output
          const output = `gap_score=${gapScore}\ncoverage_score=${stats.coverage_score}\ncritical_gaps=${criticalGaps}\nstats=${JSON.stringify(stats)}\n`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, output);
          
          console.log('Coverage Analysis:', JSON.stringify(stats));
          EOF
      
      - name: Create coverage artifact
        run: |
          mkdir -p coverage-analysis
          echo "${{ steps.coverage_analysis.outputs.stats }}" > coverage-analysis/node-${{ matrix.node-version }}-analysis.json
      
      - name: Upload coverage analysis
        uses: actions/upload-artifact@v4
        with:
          name: coverage-analysis-node-${{ matrix.node-version }}
          path: coverage-analysis/
          retention-days: 5
    
    outputs:
      gap_score: ${{ steps.coverage_analysis.outputs.gap_score }}
      coverage_score: ${{ steps.coverage_analysis.outputs.coverage_score }}
      critical_gaps: ${{ steps.coverage_analysis.outputs.critical_gaps }}
  
  summary:
    runs-on: ubuntu-latest
    needs: analyze-coverage
    if: always()
    
    steps:
      - name: Report coverage analysis
        run: |
          echo "## Test Coverage Analysis Summary"
          echo ""
          echo "- Coverage Score: ${{ needs.analyze-coverage.outputs.coverage_score }}%"
          echo "- Gap Score: ${{ needs.analyze-coverage.outputs.gap_score }}%"
          echo "- Critical Gaps Detected: ${{ needs.analyze-coverage.outputs.critical_gaps }}"
