name: "🤖 Auto Merge (Copilot Suggestion)"

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  check_suite:
    types: [completed]

env:
  AUTO_MERGE_ENABLED: ${{ secrets.AUTO_MERGE_ENABLED }}
  NODE_VERSION: "18"

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  evaluate-merge-eligibility:
    name: "🔍 Evaluate Auto-Merge Eligibility"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      eligible: ${{ steps.decision.outputs.eligible }}
      reason: ${{ steps.decision.outputs.reason }}
      pr_files: ${{ steps.decision.outputs.pr_files }}

    steps:
      # ============================================================
      # Step 1: Checkout Code
      # ============================================================
      - name: "📦 Checkout Repository"
        uses: actions/checkout@v4

      # ============================================================
      # Step 2: Setup Node.js
      # ============================================================
      - name: "🔧 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # ============================================================
      # Step 3: Install Dependencies
      # ============================================================
      - name: "📚 Install Dependencies"
        run: npm ci

      # ============================================================
      # Step 4: Check Auto-Merge Status
      # ============================================================
      - name: "⚙️  Check Auto-Merge Status"
        id: check_enabled
        run: |
          if [[ "${{ env.AUTO_MERGE_ENABLED }}" != "true" ]]; then
            echo "❌ Auto-merge is disabled"
            echo "enabled=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "✅ Auto-merge is enabled"
          echo "enabled=true" >> $GITHUB_OUTPUT

      # ============================================================
      # Step 5: Validate PR Prerequisites
      # ============================================================
      - name: "🔐 Validate PR Prerequisites"
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // Check 1: Not a Draft PR
            if (pr.draft) {
              core.setOutput('valid', 'false');
              core.setOutput('reason', 'PR is in Draft state');
              return;
            }
            
            // Check 2: Has copilot-suggestion label
            const hasCopilotLabel = pr.labels.some(l => l.name === 'copilot-suggestion');
            if (!hasCopilotLabel) {
              core.setOutput('valid', 'false');
              core.setOutput('reason', 'Missing copilot-suggestion label');
              return;
            }
            
            // Check 3: Auto-merge checkbox in body
            const body = pr.body || '';
            const autoMergeChecked = /- \[x\]\s*本 PR は自動マージ条件を満たします/.test(body) ||
                                      /- \[x\]\s*This PR satisfies auto-merge conditions/.test(body);
            if (!autoMergeChecked) {
              core.setOutput('valid', 'false');
              core.setOutput('reason', 'Auto-merge checkbox not checked in PR body');
              return;
            }
            
            core.setOutput('valid', 'true');
            core.setOutput('reason', 'All prerequisites met');

      # ============================================================
      # Step 6: Analyze Changed Files
      # ============================================================
      - name: "📋 Analyze Changed Files"
        id: files
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const ALLOWED_EXTENSIONS = ['.md', '.json', '.yml', '.yaml', '.gitignore'];
            const BLOCKED_PATHS = ['src/', 'backend/', 'frontend/', 'scripts/'];
            
            let allFilesValid = true;
            const fileList = [];
            
            for (const file of files) {
              const filename = file.filename;
              fileList.push(filename);
              
              // Check if file is code
              const isCode = filename.match(/\.(js|ts|jsx|tsx)$/i);
              const isBlocked = BLOCKED_PATHS.some(p => filename.startsWith(p));
              const isAllowed = ALLOWED_EXTENSIONS.some(ext => filename.endsWith(ext));
              
              if (isCode || isBlocked) {
                console.log(`❌ Code file not allowed: ${filename}`);
                allFilesValid = false;
              } else if (!isAllowed && !filename.match(/\.(md|yml|yaml|json|gitignore)$/i)) {
                console.log(`⚠️  Unusual file type: ${filename}`);
              } else {
                console.log(`✅ Allowed: ${filename}`);
              }
            }
            
            core.setOutput('valid', allFilesValid.toString());
            core.setOutput('file_list', JSON.stringify(fileList));
            core.setOutput('file_count', files.length.toString());

      # ============================================================
      # Step 7: Verify All CI Checks Passed
      # ============================================================
      - name: "✅ Verify All CI Checks"
        id: checks
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
            });
            
            const requiredChecks = ['lint', 'type-check', 'sast', 'unit-test', 'coverage'];
            let allPassed = true;
            
            for (const required of requiredChecks) {
              const checkRun = checkRuns.check_runs.find(c => 
                c.name.toLowerCase().includes(required) && 
                c.status === 'completed'
              );
              
              if (!checkRun) {
                console.log(`⚠️  Missing check: ${required}`);
                continue;
              }
              
              if (checkRun.conclusion === 'success') {
                console.log(`✅ ${checkRun.name}: PASSED`);
              } else {
                console.log(`❌ ${checkRun.name}: ${checkRun.conclusion}`);
                allPassed = false;
              }
            }
            
            core.setOutput('all_passed', allPassed.toString());

      # ============================================================
      # Step 8: Final Decision
      # ============================================================
      - name: "🎯 Final Decision"
        id: decision
        if: steps.check_enabled.outputs.enabled == 'true'
        run: |
          PREREQUISITES_VALID="${{ steps.validate.outputs.valid }}"
          FILES_VALID="${{ steps.files.outputs.valid }}"
          CHECKS_PASSED="${{ steps.checks.outputs.all_passed }}"
          
          if [[ "$PREREQUISITES_VALID" != "true" ]]; then
            echo "eligible=false" >> $GITHUB_OUTPUT
            echo "reason=${{ steps.validate.outputs.reason }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if [[ "$FILES_VALID" != "true" ]]; then
            echo "eligible=false" >> $GITHUB_OUTPUT
            echo "reason=Code files detected; manual review required" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if [[ "$CHECKS_PASSED" != "true" ]]; then
            echo "eligible=false" >> $GITHUB_OUTPUT
            echo "reason=Some CI checks failed or not completed" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "eligible=true" >> $GITHUB_OUTPUT
          echo "reason=All auto-merge conditions met ✅" >> $GITHUB_OUTPUT
          echo "pr_files=${{ steps.files.outputs.file_list }}" >> $GITHUB_OUTPUT

  # ============================================================
  # Job 2: Execute Auto-Merge
  # ============================================================
  auto-merge:
    name: "🚀 Execute Auto-Merge"
    needs: evaluate-merge-eligibility
    runs-on: ubuntu-latest
    if: needs.evaluate-merge-eligibility.outputs.eligible == 'true'
    timeout-minutes: 5

    steps:
      # ============================================================
      # Step 1: Checkout Code
      # ============================================================
      - name: "📦 Checkout Repository"
        uses: actions/checkout@v4

      # ============================================================
      # Step 2: Record Merge Audit Log
      # ============================================================
      - name: "📊 Prepare Audit Log"
        id: audit
        run: |
          AUDIT_LOG=".github/audit/auto-merge-log.jsonl"
          mkdir -p "$(dirname "$AUDIT_LOG")"
          
          AUDIT_ENTRY=$(cat <<EOF
          {
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "pr_number": ${{ github.event.pull_request.number }},
            "pr_title": "${{ github.event.pull_request.title }}",
            "pr_author": "${{ github.event.pull_request.user.login }}",
            "pr_sha": "${{ github.event.pull_request.head.sha }}",
            "merged_by": "${{ github.actor }}",
            "files_changed": ${{ needs.evaluate-merge-eligibility.outputs.pr_files }},
            "status": "MERGED"
          }
          EOF
          )
          
          echo "$AUDIT_ENTRY" >> "$AUDIT_LOG"
          echo "✅ Audit log recorded"

      # ============================================================
      # Step 3: Enable Auto-Merge
      # ============================================================
      - name: "✅ Enable Auto-Merge via GitHub API"
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const response = await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                merge_method: 'squash',
                commit_title: `${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }})`,
                commit_message: `Automated merge by Copilot Quality Harness\n\nThis PR was automatically merged because it met all auto-merge criteria:\n- Changes are documentation/config only\n- All CI checks passed\n- Copilot suggestion approved\n\nAudit Trail: See .github/audit/auto-merge-log.jsonl`
              });
              
              console.log('✅ PR merged successfully');
              console.log('Merge commit SHA:', response.data.sha);
              
            } catch (error) {
              if (error.status === 405) {
                core.warning('⚠️  Auto-merge not available (may be disabled in branch protection rules)');
              } else {
                core.setFailed(`Failed to merge PR: ${error.message}`);
              }
            }

      # ============================================================
      # Step 4: Post Merge Comment
      # ============================================================
      - name: "💬 Post Merge Confirmation"
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const comment = `
## 🤖 Auto-Merge Complete
✅ This PR was automatically merged by Copilot Quality Harness.

### Merge Details
- **Method**: Squash merge
- **Merged by**: ${{ github.actor }}
- **Timestamp**: ${new Date().toISOString()}

### Audit Record
All merge details have been recorded in \`.github/audit/auto-merge-log.jsonl\`

---
For more info, see [Auto-Merge Policy](.github/auto-merge-policy.md)
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ============================================================
  # Job 3: Ineligible PR Notification
  # ============================================================
  ineligible-notification:
    name: "📝 Notify Ineligible PR"
    needs: evaluate-merge-eligibility
    runs-on: ubuntu-latest
    if: needs.evaluate-merge-eligibility.outputs.eligible != 'true'
    timeout-minutes: 5

    steps:
      # ============================================================
      # Step 1: Post Ineligibility Comment
      # ============================================================
      - name: "💬 Comment on Ineligible PR"
        uses: actions/github-script@v7
        with:
          script: |
            const reason = `${{ needs.evaluate-merge-eligibility.outputs.reason }}`;
            
            const comment = `
## ⚠️  Auto-Merge Not Eligible

**Reason**: ${reason}

This PR does not meet the auto-merge criteria and requires manual review.

### Auto-Merge Requirements
- [ ] Changes are documentation/config/lint only
- [ ] All CI checks pass
- [ ] Labeled with \`copilot-suggestion\`
- [ ] Auto-merge checkbox checked in PR body
- [ ] No code files modified

For details, see [Auto-Merge Policy](.github/auto-merge-policy.md)

---
**Note**: Once issues are resolved, re-run the workflow or push new commits to re-evaluate.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ============================================================
  # Job 4: Post-Merge Monitoring (Rollback on Error)
  # ============================================================
  post-merge-monitor:
    name: "🔍 Post-Merge Monitoring"
    needs: auto-merge
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 35

    steps:
      # ============================================================
      # Step 1: Wait for Deployment
      # ============================================================
      - name: "⏳ Wait for Deployment"
        run: |
          echo "Monitoring post-merge status for 30 minutes..."
          sleep 60  # Wait 1 minute before checking
          echo "✅ Post-merge monitoring initiated"

      # ============================================================
      # Step 2: Check Error Rate (Optional)
      # ============================================================
      - name: "📊 Check Error Rate"
        run: |
          # This is a placeholder for actual monitoring
          # In production, integrate with logs/metrics service
          echo "⏸️  Error rate monitoring (placeholder)"
          echo "In production: Check CloudWatch / DataDog / etc."

      # ============================================================
      # Step 3: Cleanup
      # ============================================================
      - name: "🧹 Cleanup"
        run: |
          echo "✅ Post-merge monitoring complete"
