name: Test Matrix

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'package*.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test-matrix.yml'
      - 'playwright.config.js'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'package*.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test-matrix.yml'
      - 'playwright.config.js'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
        test-type: [unit, api, e2e, advanced]
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      
      - name: Cache Playwright browsers
        if: matrix.test-type == 'e2e'
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v2-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-v2-
      
      - name: Install Playwright browsers (if cache miss)
        if: matrix.test-type == 'e2e' && steps.cache-playwright.outputs.cache-hit != 'true'
        run: |
          echo "📦 Installing Playwright browsers (cache miss)..."
          pnpm exec playwright install --with-deps chromium
          echo "✅ Playwright browsers installed"
      
      - name: Install dependencies (without postinstall)
        run: |
          echo "📦 Installing dependencies with pnpm install..."
          pnpm install --frozen-lockfile
          echo "✅ Dependencies installed"
          node --version
          pnpm --version
      
      - name: Build native modules
        run: |
          echo "🔨 Building native modules (better-sqlite3, etc.)..."
          pnpm rebuild 2>&1 || pnpm rebuild --build-from-source 2>&1
          echo "✅ Native modules built"
      
      - name: Install/Update Playwright browsers
        if: matrix.test-type == 'e2e'
        run: |
          echo "🎭 Installing/updating Playwright browsers..."
          pnpm exec playwright install --with-deps chromium
          echo "✅ Playwright browsers ready"
      
      - name: Run unit tests
        if: matrix.test-type == 'unit'
        id: test-unit
        continue-on-error: true
        run: |
          echo "🚀 ==================== START: Unit Tests (v2) ===================="
          echo "Node version: $(node --version)"
          
          # Run backend tests first, then frontend (sequential execution to avoid database contention)
          # Use current directory for logs (will be archived with test results)
          echo "📝 Running backend unit tests..."
          pnpm --filter quality-harness-backend run test 2>&1 | tee test-result-backend.log
          BACKEND_EXIT=$?
          
          echo ""
          echo "📝 Running frontend unit tests..."
          pnpm --filter quality-harness-frontend run test 2>&1 | tee -a test-result-backend.log
          FRONTEND_EXIT=$?
          
          # Copy combined log to expected location
          cp test-result-backend.log test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log
          
          # Combine results
          if [ $BACKEND_EXIT -ne 0 ] || [ $FRONTEND_EXIT -ne 0 ]; then
            TEST_EXIT_CODE=1
          else
            TEST_EXIT_CODE=0
          fi
          
          echo "✅ Unit tests completed with exit code: $TEST_EXIT_CODE"
          
          echo "📊 Generating coverage report..."
          pnpm run test:coverage 2>&1 || true
          
          # Extract coverage percentage
          if [ -f coverage/coverage-final.json ]; then
            NODE_PATH=. node -e "
              const coverage = require('./coverage/coverage-final.json');
              if (coverage && typeof coverage === 'object') {
                const lines = Object.values(coverage).map(f => f.s).filter(Boolean).length;
                const total = Object.values(coverage).length;
                const pct = total > 0 ? Math.round((lines / total) * 100) : 0;
                console.log('COVERAGE_PCT=' + pct);
              }
            " >> $GITHUB_ENV || echo "COVERAGE_PCT=0" >> $GITHUB_ENV
          else
            echo "COVERAGE_PCT=0" >> $GITHUB_ENV
          fi
          
          echo "🏁 ==================== END: Unit Tests ===================="
      
      - name: Run API tests
        if: matrix.test-type == 'api'
        id: test-api
        continue-on-error: true
        run: |
          echo "🚀 ==================== START: API Tests ===================="
          pnpm run test:api 2>&1 | tee test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log
          echo "✅ API tests completed"
          echo "🏁 ==================== END: API Tests ===================="
      
      - name: Verify API test log was created
        if: matrix.test-type == 'api'
        run: |
          FILE="test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log"
          echo "🔍 Checking if $FILE exists..."
          if [ -f "$FILE" ]; then
            echo "✅ File exists! Size: $(wc -c < "$FILE") bytes"
            echo "📄 First 200 characters:"
            head -c 200 "$FILE"
            echo ""
          else
            echo "❌ File does NOT exist"
            ls -la test-result* || echo "No test-result files found"
          fi
      
      - name: Run E2E tests
        if: matrix.test-type == 'e2e'
        id: test-e2e
        continue-on-error: true
        run: |
          echo "🚀 ==================== START: E2E Tests ===================="
          
          echo ""
          echo "✅【ステップ 0】AWS Emulator セットアップ..."
          echo "   • docker-compose で AWS Emulator を起動"
          echo "   • リソース初期化（DynamoDB、S3、SQS）を実行"
          
          # Set AWS environment variables
          export AWS_ENDPOINT_URL="https://127.0.0.1:9297"
          export AWS_REGION="us-east-1"
          export AWS_ACCESS_KEY_ID="test"
          export AWS_SECRET_ACCESS_KEY="test"
          
          # Start AWS Emulator
          echo "🐳 Starting AWS Emulator via docker compose..."
          docker compose up -d aws-emulator 2>&1 || { echo "❌ Failed to start AWS Emulator"; docker compose ps; exit 1; }
          
          # Wait for emulator to be ready
          echo "⏳ Waiting for AWS Emulator to be healthy..."
          max_attempts=60
          attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            if docker compose exec -T aws-emulator curl -f -k https://localhost:9297/health >/dev/null 2>&1; then
              echo "✅ AWS Emulator is healthy"
              break
            fi
            attempt=$((attempt + 1))
            echo "  Attempt $attempt/$max_attempts..."
            sleep 2
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ AWS Emulator failed to become healthy"
            docker compose logs aws-emulator | tail -50 || true
            exit 1
          fi
          
          # Extract certificate from container
          mkdir -p certs
          if docker compose exec -T aws-emulator test -f /.aws-emulator/ca.pem >/dev/null 2>&1; then
            docker compose cp "aws-emulator:/.aws-emulator/ca.pem" certs/ca.pem || echo "⚠️ Failed to copy CA"
            export NODE_EXTRA_CA_CERTS="$PWD/certs/ca.pem"
            echo "✅ Certificate configured (/.aws-emulator/ca.pem)"
          elif docker compose exec -T aws-emulator test -f /home/emulator/.aws/emulator/ca.pem >/dev/null 2>&1; then
            docker compose cp "aws-emulator:/home/emulator/.aws/emulator/ca.pem" certs/ca.pem || echo "⚠️ Failed to copy CA"
            export NODE_EXTRA_CA_CERTS="$PWD/certs/ca.pem"
            echo "✅ Certificate configured (/home/emulator/.aws/emulator/ca.pem)"
          else
            echo "⚠️  CA certificate not found in container"
          fi
          
          # Initialize AWS resources
          echo "📊 Initializing AWS resources..."
          pnpm run init:aws 2>&1 || { echo "⚠️ AWS resource initialization failed, continuing..."; }
          
          echo ""
          echo "✅【ステップ 1】Playwright バージョン確認..."
          pnpm exec playwright --version
          
          echo ""
          echo "🚀【ステップ 2】E2E テスト実行..."
          echo "   • テストが自動でサーバーを起動します（playwright.config.js の webServer 設定）"
          echo ""
          
          pnpm run test:e2e 2>&1 | tee test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log
          E2E_EXIT_CODE=$?
          
          echo ""
          echo "✅ E2E test execution completed with exit code: $E2E_EXIT_CODE"
          echo "📊 Test results saved to test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log"
          echo "🏁 ==================== END: E2E Tests ===================="
          
          exit $E2E_EXIT_CODE
      
      - name: Verify E2E test log was created
        if: matrix.test-type == 'e2e'
        run: |
          FILE="test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log"
          echo "🔍 Checking if $FILE exists..."
          if [ -f "$FILE" ]; then
            echo "✅ File exists! Size: $(wc -c < "$FILE") bytes"
            echo "📄 Last 300 characters:"
            tail -c 300 "$FILE"
            echo ""
          else
            echo "❌ File does NOT exist"
            ls -la test-result* || echo "No test-result files found"
          fi
      
      - name: Run advanced tests
        if: matrix.test-type == 'advanced'
        id: test-advanced
        continue-on-error: true
        run: |
          echo "🚀 ==================== START: Advanced Tests (v2) ===================="
          
          # Run backend advanced tests first, then frontend (sequential execution to avoid database contention)
          # Use current directory for logs (will be archived with test results)
          echo "📝 Running backend advanced tests..."
          pnpm --filter quality-harness-backend run test:advanced 2>&1 | tee test-result-advanced.log
          BACKEND_ADV_EXIT=$?
          
          echo ""
          echo "📝 Running frontend advanced tests..."
          pnpm --filter quality-harness-frontend run test:advanced 2>&1 | tee -a test-result-advanced.log
          FRONTEND_ADV_EXIT=$?
          
          # Copy combined log to expected location
          cp test-result-advanced.log test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log
          
          # Combine results
          if [ $BACKEND_ADV_EXIT -ne 0 ] || [ $FRONTEND_ADV_EXIT -ne 0 ]; then
            ADVANCED_EXIT_CODE=1
          else
            ADVANCED_EXIT_CODE=0
          fi
          
          echo "✅ Advanced tests completed with exit code: $ADVANCED_EXIT_CODE"
          echo "🏁 ==================== END: Advanced Tests ===================="
      
      - name: Parse test results
        id: parse_results
        continue-on-error: true
        run: |
          # Use external script for parsing (v2)
          node scripts/parse-test-result.js ${{ matrix.node-version }} ${{ matrix.test-type }}
      
      - name: Verify test result file was created
        run: |
          FILE="test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.json"
          echo "🔍 Checking if test result file was created: $FILE"
          
          if [ ! -f "$FILE" ]; then
            echo "❌ ERROR: Test result file NOT created: $FILE"
            echo "📂 Current directory contents:"
            ls -la
            echo ""
            echo "📊 Test log contents (if exists):"
            LOG="/tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log"
            if [ -f "$LOG" ]; then
              tail -50 "$LOG"
            else
              echo "❌ Test log file also not found: $LOG"
            fi
            exit 1
          fi
          
          echo "✅ Test result file created successfully: $FILE"
          echo "📄 Content:"
          cat "$FILE"
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}-${{ matrix.test-type }}
          path: test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.json
          retention-days: 5
      
      - name: Upload Playwright report (E2E only)
        if: always() && matrix.test-type == 'e2e'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 5
      
      - name: Upload E2E test-results (E2E only)
        if: always() && matrix.test-type == 'e2e'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-node-${{ matrix.node-version }}
          path: test-results/
          retention-days: 5
      
      - name: Upload E2E videos separately
        if: always() && matrix.test-type == 'e2e'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-videos-node-${{ matrix.node-version }}
          path: test-results/videos/
          retention-days: 5
          if-no-files-found: ignore
      
      - name: Upload coverage report (Unit tests only)
        if: always() && matrix.test-type == 'unit' && (hashFiles('coverage/**') != '' || hashFiles('frontend/coverage/**') != '' || hashFiles('backend/coverage/**') != '')
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: |
            coverage/
            frontend/coverage/
            backend/coverage/
          retention-days: 5
          if-no-files-found: ignore
  
  test-summary:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      
      - name: Download all test results
        id: download_results
        uses: actions/download-artifact@v4
        with:
          path: test-results-all
      
      - name: Verify test results were downloaded
        run: |
          echo "🔍 Checking for downloaded test results..."
          
          if [ ! -d "test-results-all" ]; then
            echo "❌ ERROR: Directory test-results-all not found"
            echo "📂 Current directory structure:"
            find . -maxdepth 2 -type d
            exit 1
          fi
          
          FILE_COUNT=$(find test-results-all -type f | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ ERROR: No test result files found in test-results-all"
            echo "📂 Directory contents:"
            ls -laR test-results-all
            exit 1
          fi
          
          echo "✅ Test results downloaded successfully ($FILE_COUNT files)"
          echo "📂 Contents of test-results-all:"
          find test-results-all -type f -exec echo "  - {}" \;
          
          echo ""
          echo "📊 File details:"
          find test-results-all -type f -name "*.json" -exec sh -c 'echo "File: {}"; head -20 "{}"' \;
      
      - name: Generate test matrix summary
        run: node scripts/generate-test-matrix-summary.js
      
      - name: Verify test matrix completeness
        run: |
          echo "🔍 Checking test matrix completeness..."
          
          if [ ! -f "test-matrix-summary.json" ]; then
            echo "❌ ERROR: test-matrix-summary.json not created"
            exit 1
          fi
          
          node scripts/verify-test-matrix-completeness.js
      
      - name: Upload test summary
        uses: actions/upload-artifact@v4
        with:
          name: test-matrix-summary
          path: test-matrix-summary.json
          retention-days: 5
      
      - name: Set test status output
        id: test_status
        run: |
          if [ -f test-matrix-summary.json ]; then
            STATUS=$(node scripts/get-test-status.js)
            echo "status=$STATUS" >> $GITHUB_OUTPUT
          fi
        shell: bash
# Trigger test-matrix
