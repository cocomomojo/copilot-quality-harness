name: Test Matrix

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
        test-type: [unit, api, e2e, advanced]
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      
      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci || {
            echo "❌ npm ci failed. Retrying with npm install..."
            npm install || {
              echo "❌ npm install also failed. Aborting."
              exit 1
            }
          }
          echo "✅ Dependencies installed successfully"
          echo "📋 Node version:"
          node --version
          echo "📋 npm version:"
          npm --version
      
      - name: Run unit tests
        if: matrix.test-type == 'unit'
        id: test-unit
        continue-on-error: true
        run: |
          echo "🚀 ==================== START: Unit Tests ===================="
          echo "Node version: $(node --version)"
          npm test 2>&1 | tee /tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log
          TEST_EXIT_CODE=$?
          echo "✅ Unit tests completed with exit code: $TEST_EXIT_CODE"
          
          echo "📊 Generating coverage report..."
          npm run test:coverage 2>&1 || true
          
          # Extract coverage percentage
          if [ -f coverage/coverage-final.json ]; then
            NODE_PATH=. node -e "
              const coverage = require('./coverage/coverage-final.json');
              if (coverage && typeof coverage === 'object') {
                const lines = Object.values(coverage).map(f => f.s).filter(Boolean).length;
                const total = Object.values(coverage).length;
                const pct = total > 0 ? Math.round((lines / total) * 100) : 0;
                console.log('COVERAGE_PCT=' + pct);
              }
            " >> $GITHUB_ENV || echo "COVERAGE_PCT=0" >> $GITHUB_ENV
          else
            echo "COVERAGE_PCT=0" >> $GITHUB_ENV
          fi
          
          echo "🏁 ==================== END: Unit Tests ===================="
      
      - name: Run API tests
        if: matrix.test-type == 'api'
        id: test-api
        continue-on-error: true
        run: |
          echo "🚀 ==================== START: API Tests ===================="
          npm run test:api 2>&1 | tee /tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log
          echo "✅ API tests completed"
          echo "🏁 ==================== END: API Tests ===================="
      
      - name: Run E2E tests
        if: matrix.test-type == 'e2e'
        id: test-e2e
        continue-on-error: true
        run: |
          echo "🚀 ==================== START: E2E Tests ===================="
          echo "📋【ステップ 1】Playwright ブラウザをインストール..."
          npx playwright install --with-deps chromium
          
          echo "✅【ステップ 2】インストール確認..."
          npx playwright --version
          
          echo "📂 キャッシュディレクトリを確認:"
          ls -la ~/.cache/ms-playwright/chromium* 2>/dev/null || echo "❌ Chromium が見つかりません"
          find ~/.cache/ms-playwright -name "chrome-headless-shell*" -o -name "chromium*" | head -5
          
          echo ""
          echo "⚠️【ステップ 3】ブラウザバイナリの権限を確認..."
          find ~/.cache/ms-playwright -type f -executable -name "chrome*" | head -3
          
          echo ""
          echo "🚀【ステップ 4】E2E テスト実行..."
          echo "   • フロントエンド: npm run dev --workspace frontend (port 5173)"
          echo "   • バックエンド: npm run start --workspace backend (port 3000)"
          echo "   • テストが自動でサーバーを起動します（playwright.config.js の webServer 設定）"
          echo ""
          
          npm run test:e2e 2>&1 | tee /tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log
          E2E_EXIT_CODE=$?
          
          echo ""
          echo "✅ E2E test execution completed with exit code: $E2E_EXIT_CODE"
          echo "📊 Test results saved to /tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log"
          echo "🏁 ==================== END: E2E Tests ===================="
      
      - name: Run advanced tests
        if: matrix.test-type == 'advanced'
        id: test-advanced
        continue-on-error: true
        run: |
          echo "🚀 ==================== START: Advanced Tests ===================="
          npm run test:advanced 2>&1 | tee /tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log
          ADVANCED_EXIT_CODE=$?
          echo "✅ Advanced tests completed with exit code: $ADVANCED_EXIT_CODE"
          echo "🏁 ==================== END: Advanced Tests ===================="
      
      - name: Parse test results
        id: parse_results
        continue-on-error: true
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const logFile = '/tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log';
          
          let result = {
            test_type: '${{ matrix.test-type }}',
            node_version: '${{ matrix.node-version }}',
            status: 'unknown',
            passed: 0,
            failed: 0,
            skipped: 0,
            timestamp: new Date().toISOString()
          };
          
          if (fs.existsSync(logFile)) {
            const content = fs.readFileSync(logFile, 'utf-8');
            
            // Match Vitest, Node test runner, and Mocha output formats
            const vitestPass = content.match(/✓\s+(\d+)\s+passed/);
            const vitestFail = content.match(/✖\s+(\d+)\s+failed/);
            const vitestSkip = content.match(/⊘\s+(\d+)\s+skipped/);
            
            const mochaPass = content.match(/(\d+)\s+passing/);
            const mochaFail = content.match(/(\d+)\s+failing/);
            const mochaSkip = content.match(/(\d+)\s+pending/);
            
            const nodePass = content.match(/tests\s+(\d+)/);
            const nodeFail = content.match(/failures\s+(\d+)/);
            
            // Try Vitest format first (modern default)
            result.passed = vitestPass ? parseInt(vitestPass[1]) : (mochaPass ? parseInt(mochaPass[1]) : 0);
            result.failed = vitestFail ? parseInt(vitestFail[1]) : (mochaFail ? parseInt(mochaFail[1]) : 0);
            result.skipped = vitestSkip ? parseInt(vitestSkip[1]) : (mochaSkip ? parseInt(mochaSkip[1]) : 0);
            
            // For Playwright (E2E), look for "passed/failed" pattern
            if ('${{ matrix.test-type }}' === 'e2e') {
              const pwPass = content.match(/(\d+)\s+passed/);
              const pwFail = content.match(/(\d+)\s+failed/);
              result.passed = pwPass ? parseInt(pwPass[1]) : 0;
              result.failed = pwFail ? parseInt(pwFail[1]) : 0;
            }
            
            result.status = result.failed === 0 ? 'passed' : 'failed';
          } else {
            result.status = 'error';
          }
          
          // Write JSON result
          fs.writeFileSync('test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.json', JSON.stringify(result));
          
          // Output result to GitHub Actions environment
          const output = `status=${result.status}\npassed=${result.passed}\nfailed=${result.failed}\n`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, output);
          
          console.log('Test Results:', JSON.stringify(result));
          EOF
      
      - name: Verify test result file was created
        run: |
          FILE="test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.json"
          echo "🔍 Checking if test result file was created: $FILE"
          
          if [ ! -f "$FILE" ]; then
            echo "❌ ERROR: Test result file NOT created: $FILE"
            echo "📂 Current directory contents:"
            ls -la
            echo ""
            echo "📊 Test log contents (if exists):"
            LOG="/tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log"
            if [ -f "$LOG" ]; then
              tail -50 "$LOG"
            else
              echo "❌ Test log file also not found: $LOG"
            fi
            exit 1
          fi
          
          echo "✅ Test result file created successfully: $FILE"
          echo "📄 Content:"
          cat "$FILE"
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}-${{ matrix.test-type }}
          path: test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.json
          retention-days: 5
      
      - name: Upload Playwright report (E2E only)
        if: always() && matrix.test-type == 'e2e'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 5
      
      - name: Upload E2E test-results (E2E only)
        if: always() && matrix.test-type == 'e2e'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-node-${{ matrix.node-version }}
          path: test-results/
          retention-days: 5
      
      - name: Upload E2E videos separately
        if: always() && matrix.test-type == 'e2e'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-videos-node-${{ matrix.node-version }}
          path: test-results/videos/
          retention-days: 5
          if-no-files-found: ignore
      
      - name: Upload coverage report (Unit tests only)
        if: always() && matrix.test-type == 'unit' && (hashFiles('coverage/**') != '' || hashFiles('frontend/coverage/**') != '' || hashFiles('backend/coverage/**') != '')
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: |
            coverage/
            frontend/coverage/
            backend/coverage/
          retention-days: 5
          if-no-files-found: ignore
  
  test-summary:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    
    steps:
      - name: Download all test results
        id: download_results
        uses: actions/download-artifact@v4
        with:
          path: test-results-all
      
      - name: Verify test results were downloaded
        run: |
          echo "🔍 Checking for downloaded test results..."
          
          if [ ! -d "test-results-all" ]; then
            echo "❌ ERROR: Directory test-results-all not found"
            echo "📂 Current directory structure:"
            find . -maxdepth 2 -type d
            exit 1
          fi
          
          FILE_COUNT=$(find test-results-all -type f | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ ERROR: No test result files found in test-results-all"
            echo "📂 Directory contents:"
            ls -laR test-results-all
            exit 1
          fi
          
          echo "✅ Test results downloaded successfully ($FILE_COUNT files)"
          echo "📂 Contents of test-results-all:"
          find test-results-all -type f -exec echo "  - {}" \;
          
          echo ""
          echo "📊 File details:"
          find test-results-all -type f -name "*.json" -exec sh -c 'echo "File: {}"; head -20 "{}"' \;
      
      - name: Generate test matrix summary
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          
          const resultsDir = 'test-results-all';
          const allResults = [];
          const expectedTestTypes = ['unit', 'api', 'e2e', 'advanced'];
          
          console.log('📂 Reading test results from:', resultsDir);
          if (!fs.existsSync(resultsDir)) {
            console.error('❌ ERROR: Directory not found:', resultsDir);
            process.exit(1);
          }
          
          const dirs = fs.readdirSync(resultsDir);
          console.log('Found result directories:', dirs);
          console.log('Number of directories:', dirs.length);
          
          // Collect all test results
          for (const dir of dirs) {
            const dirPath = path.join(resultsDir, dir);
            console.log('\\n  📂 Processing directory:', dir);
            
            try {
              const files = fs.readdirSync(dirPath);
              console.log('    Files found:', files);
              
              const jsonFile = files.find(f => f.endsWith('.json'));
              if (!jsonFile) {
                console.error('    ❌ No JSON file found in this directory');
                continue;
              }
              
              const jsonPath = path.join(dirPath, jsonFile);
              const rawData = fs.readFileSync(jsonPath, 'utf-8');
              console.log('    File size:', rawData.length, 'bytes');
              
              const data = JSON.parse(rawData);
              console.log('    ✓ Parsed:', { test_type: data.test_type, node_version: data.node_version, passed: data.passed, failed: data.failed, status: data.status });
              allResults.push(data);
            } catch (e) {
              console.error('    ❌ Error:', e.message);
            }
          }
          
          console.log('\\n📊 ==================== SUMMARY ====================');
          console.log('Total results collected:', allResults.length);
          console.log('Expected test types:', expectedTestTypes);
          
          // Check test type coverage
          const foundTestTypes = new Set(allResults.map(r => r.test_type));
          const missingTestTypes = expectedTestTypes.filter(t => !foundTestTypes.has(t));
          
          if (missingTestTypes.length > 0) {
            console.warn('⚠️  WARNING: Missing test types:', missingTestTypes);
            console.warn('  Found test types:', Array.from(foundTestTypes));
          } else {
            console.log('✅ All expected test types found:', Array.from(foundTestTypes).sort());
          }
          
          console.log('\\nResults by test type:');
          allResults.forEach(r => {
            console.log('  -', r.test_type, '| passed:', r.passed, '| failed:', r.failed, '| status:', r.status);
          });
          
          // Generate summary
          const summary = {
            timestamp: new Date().toISOString(),
            total_combinations: allResults.length,
            passed_combinations: allResults.filter(r => r.status === 'passed').length,
            failed_combinations: allResults.filter(r => r.status === 'failed').length,
            total_tests: allResults.reduce((sum, r) => sum + (r.passed || 0) + (r.failed || 0), 0),
            total_passed: allResults.reduce((sum, r) => sum + (r.passed || 0), 0),
            total_failed: allResults.reduce((sum, r) => sum + (r.failed || 0), 0),
            by_node_version: {},
            by_test_type: {},
            completeness_check: {
              expected_test_types: expectedTestTypes,
              found_test_types: Array.from(foundTestTypes).sort(),
              missing_test_types: missingTestTypes
            }
          };
          
          // Validate total_tests is reasonable
          if (summary.total_tests === 0 && allResults.length > 0) {
            console.warn('⚠️  WARNING: total_tests is 0 but results exist - this indicates a problem with test result collection');
          }
          
          // Group by node version
          for (const version of [20]) {
            const versionResults = allResults.filter(r => r.node_version === version);
            summary.by_node_version[version] = {
              passed_tests: versionResults.reduce((sum, r) => sum + (r.passed || 0), 0),
              failed_tests: versionResults.reduce((sum, r) => sum + (r.failed || 0), 0),
              status: versionResults.every(r => r.status === 'passed') ? 'all_passed' : 'some_failed'
            };
          }
          
          // Group by test type
          for (const type of ['unit', 'api', 'e2e', 'advanced']) {
            const typeResults = allResults.filter(r => r.test_type === type);
            summary.by_test_type[type] = {
              passed_tests: typeResults.reduce((sum, r) => sum + (r.passed || 0), 0),
              failed_tests: typeResults.reduce((sum, r) => sum + (r.failed || 0), 0),
              combinations: typeResults.length,
              status: typeResults.length > 0 && typeResults.every(r => r.status === 'passed') ? 'all_passed' : (typeResults.length === 0 ? 'missing' : 'some_failed')
            };
          }
          
          console.log('\\n✅ ==================== FINAL TEST MATRIX SUMMARY ====================');
          console.log('Total test combinations executed:', summary.total_combinations);
          console.log('Total tests run:', summary.total_tests);
          console.log('Total passed:', summary.total_passed);
          console.log('Total failed:', summary.total_failed);
          console.log('');
          console.log('By Test Type:');
          Object.entries(summary.by_test_type).forEach(([type, stats]) => {
            const icon = stats.status === 'missing' ? '❌' : (stats.status === 'all_passed' ? '✅' : '⚠️');
            console.log(\`  \${icon} \${type}: \${stats.passed_tests} passed, \${stats.failed_tests} failed (\${stats.combinations} combo)\`);
          });
          console.log('');
          console.log('Completeness Check:');
          console.log('  Expected test types:', summary.completeness_check.expected_test_types.join(', '));
          console.log('  Found test types:', summary.completeness_check.found_test_types.join(', '));
          if (summary.completeness_check.missing_test_types.length > 0) {
            console.log('  ❌ MISSING:', summary.completeness_check.missing_test_types.join(', '));
          } else {
            console.log('  ✅ All test types present');
          }
          console.log('');
          console.log('Full Summary:');
          console.log(JSON.stringify(summary, null, 2));
          
          fs.writeFileSync('test-matrix-summary.json', JSON.stringify(summary, null, 2));
          console.log('\\n✅ Summary saved to test-matrix-summary.json');
          }
          "
      
      - name: Verify test matrix completeness
        run: |
          echo "🔍 Checking test matrix completeness..."
          
          if [ ! -f "test-matrix-summary.json" ]; then
            echo "❌ ERROR: test-matrix-summary.json not created"
            exit 1
          fi
          
          # Parse and validate
          node -e "
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('test-matrix-summary.json', 'utf-8'));
          
          console.log('📊 Test Matrix Status:');
          console.log('  Total combinations:', summary.total_combinations);
          console.log('  Total tests:', summary.total_tests);
          console.log('  Expected test types: 4 (unit, api, e2e, advanced)');
          console.log('  Found test types:', summary.completeness_check.found_test_types.length);
          
          const hasAllTypes = summary.completeness_check.missing_test_types.length === 0;
          const hasTests = summary.total_tests > 0;
          
          if (!hasAllTypes) {
            console.warn('\\n⚠️  WARNING: Incomplete test matrix');
            console.warn('  Missing test types:', summary.completeness_check.missing_test_types.join(', '));
            process.exit(1);
          }
          
          if (!hasTests) {
            console.warn('\\n⚠️  WARNING: No tests were executed');
            process.exit(1);
          }
          
          console.log('\\n✅ Test matrix is complete and valid');
          "
      
      - name: Upload test summary
        uses: actions/upload-artifact@v4
        with:
          name: test-matrix-summary
          path: test-matrix-summary.json
          retention-days: 5
      
      - name: Set test status output
        id: test_status
        run: |
          if [ -f test-matrix-summary.json ]; then
            STATUS=$(node -e "const data = require('./test-matrix-summary.json'); console.log(data.total_failed > 0 ? 'failed' : 'passed')")
            echo "status=$STATUS" >> $GITHUB_OUTPUT
          fi
        shell: bash
# Trigger test-matrix
