name: Test Matrix

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
        test-type: [unit, api, e2e, advanced]
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      
      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci || {
            echo "❌ npm ci failed. Retrying with npm install..."
            npm install || {
              echo "❌ npm install also failed. Aborting."
              exit 1
            }
          }
          echo "✅ Dependencies installed successfully"
          echo "📋 Node version:"
          node --version
          echo "📋 npm version:"
          npm --version
      
      - name: Run unit tests
        if: matrix.test-type == 'unit'
        id: test-unit
        continue-on-error: true
        run: |
          echo "🚀 ==================== START: Unit Tests ===================="
          echo "Node version: $(node --version)"
          npm test 2>&1 | tee /tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log
          TEST_EXIT_CODE=$?
          echo "✅ Unit tests completed with exit code: $TEST_EXIT_CODE"
          
          echo "📊 Generating coverage report..."
          npm run test:coverage 2>&1 || true
          
          # Extract coverage percentage
          if [ -f coverage/coverage-final.json ]; then
            node scripts/extract-unit-coverage.js coverage/coverage-final.json >> "$GITHUB_ENV" || echo "COVERAGE_PCT=0" >> "$GITHUB_ENV"
          else
            echo "COVERAGE_PCT=0" >> "$GITHUB_ENV"
          fi
          
          echo "🏁 ==================== END: Unit Tests ===================="
      
      - name: Run API tests
        if: matrix.test-type == 'api'
        id: test-api
        continue-on-error: true
        run: |
          echo "🚀 ==================== START: API Tests ===================="
          npm run test:api 2>&1 | tee /tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log
          echo "✅ API tests completed"
          echo "🏁 ==================== END: API Tests ===================="
      
      - name: Run E2E tests
        if: matrix.test-type == 'e2e'
        id: test-e2e
        continue-on-error: true
        run: |
          echo "🚀 ==================== START: E2E Tests ===================="
          echo "📋【ステップ 1】Playwright ブラウザをインストール..."
          npx playwright install --with-deps chromium
          
          echo "✅【ステップ 2】インストール確認..."
          npx playwright --version
          
          echo "📂 キャッシュディレクトリを確認:"
          ls -la ~/.cache/ms-playwright/chromium* 2>/dev/null || echo "❌ Chromium が見つかりません"
          find ~/.cache/ms-playwright -name "chrome-headless-shell*" -o -name "chromium*" | head -5
          
          echo ""
          echo "⚠️【ステップ 3】ブラウザバイナリの権限を確認..."
          find ~/.cache/ms-playwright -type f -executable -name "chrome*" | head -3
          
          echo ""
          echo "🚀【ステップ 4】E2E テスト実行..."
          echo "   • フロントエンド: npm run dev --workspace frontend (port 5173)"
          echo "   • バックエンド: npm run start --workspace backend (port 3000)"
          echo "   • テストが自動でサーバーを起動します（playwright.config.js の webServer 設定）"
          echo ""
          
          npm run test:e2e 2>&1 | tee /tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log
          E2E_EXIT_CODE=$?
          
          echo ""
          echo "✅ E2E test execution completed with exit code: $E2E_EXIT_CODE"
          echo "📊 Test results saved to /tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log"
          echo "🏁 ==================== END: E2E Tests ===================="
      
      - name: Run advanced tests
        if: matrix.test-type == 'advanced'
        id: test-advanced
        continue-on-error: true
        run: |
          echo "🚀 ==================== START: Advanced Tests ===================="
          npm run test:advanced 2>&1 | tee /tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log
          ADVANCED_EXIT_CODE=$?
          echo "✅ Advanced tests completed with exit code: $ADVANCED_EXIT_CODE"
          echo "🏁 ==================== END: Advanced Tests ===================="
      
      - name: Parse test results
        id: parse_results
        continue-on-error: true
        env:
          NODE_VERSION: ${{ matrix.node-version }}
          OUTPUT_FILE: test-result-${{ matrix.node-version }}-${{ matrix.test-type }}
          GITHUB_OUTPUT: ${{ env.GITHUB_OUTPUT }}
        run: |
          node scripts/parse-test-results.js "/tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log" "${{ matrix.test-type }}"
      
      - name: Verify test result file was created
        run: |
          FILE="test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.json"
          echo "🔍 Checking if test result file was created: $FILE"
          
          if [ ! -f "$FILE" ]; then
            echo "❌ ERROR: Test result file NOT created: $FILE"
            echo "📂 Current directory contents:"
            ls -la
            echo ""
            echo "📊 Test log contents (if exists):"
            LOG="/tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log"
            if [ -f "$LOG" ]; then
              tail -50 "$LOG"
            else
              echo "❌ Test log file also not found: $LOG"
            fi
            exit 1
          fi
          
          echo "✅ Test result file created successfully: $FILE"
          echo "📄 Content:"
          cat "$FILE"
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}-${{ matrix.test-type }}
          path: test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.json
          retention-days: 5
      
      - name: Upload Playwright report (E2E only)
        if: always() && matrix.test-type == 'e2e'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 5
      
      - name: Upload E2E test-results (E2E only)
        if: always() && matrix.test-type == 'e2e'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-node-${{ matrix.node-version }}
          path: test-results/
          retention-days: 5
      
      - name: Upload E2E videos separately
        if: always() && matrix.test-type == 'e2e'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-videos-node-${{ matrix.node-version }}
          path: test-results/videos/
          retention-days: 5
          if-no-files-found: ignore
      
      - name: Upload coverage report (Unit tests only)
        if: always() && matrix.test-type == 'unit' && (hashFiles('coverage/**') != '' || hashFiles('frontend/coverage/**') != '' || hashFiles('backend/coverage/**') != '')
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: |
            coverage/
            frontend/coverage/
            backend/coverage/
          retention-days: 5
          if-no-files-found: ignore
  
  test-summary:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    
    steps:
      - name: Download all test results
        id: download_results
        uses: actions/download-artifact@v4
        with:
          path: test-results-all
      
      - name: Verify test results were downloaded
        run: |
          echo "🔍 Checking for downloaded test results..."
          
          if [ ! -d "test-results-all" ]; then
            echo "❌ ERROR: Directory test-results-all not found"
            echo "📂 Current directory structure:"
            find . -maxdepth 2 -type d
            exit 1
          fi
          
          FILE_COUNT=$(find test-results-all -type f | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ ERROR: No test result files found in test-results-all"
            echo "📂 Directory contents:"
            ls -laR test-results-all
            exit 1
          fi
          
          echo "✅ Test results downloaded successfully ($FILE_COUNT files)"
          echo "📂 Contents of test-results-all:"
          find test-results-all -type f -exec echo "  - {}" \;
          
          echo ""
          echo "📊 File details:"
          find test-results-all -type f -name "*.json" -exec sh -c 'echo "File: {}"; head -20 "{}"' \;
      
      - name: Generate test matrix summary
        run: node scripts/generate-test-matrix-summary.js
      
      - name: Verify test matrix completeness
        run: |
          echo "🔍 Checking test matrix completeness..."
          
          if [ ! -f "test-matrix-summary.json" ]; then
            echo "❌ ERROR: test-matrix-summary.json not created"
            exit 1
          fi
          
          node scripts/verify-test-matrix-completeness.js
      
      - name: Upload test summary
        uses: actions/upload-artifact@v4
        with:
          name: test-matrix-summary
          path: test-matrix-summary.json
          retention-days: 5
      
      - name: Set test status output
        id: test_status
        run: |
          if [ -f test-matrix-summary.json ]; then
            STATUS=$(node scripts/get-test-status.js)
            echo "status=$STATUS" >> $GITHUB_OUTPUT
          fi
        shell: bash
# Trigger test-matrix
