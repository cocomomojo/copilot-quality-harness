name: Test Matrix

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
        test-type: [unit, api, e2e, advanced]
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        if: matrix.test-type == 'unit'
        id: test-unit
        continue-on-error: true
        run: npm test 2>&1 | tee /tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log
      
      - name: Run API tests
        if: matrix.test-type == 'api'
        id: test-api
        continue-on-error: true
        run: npm run test:api 2>&1 | tee /tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log
      
      - name: Run E2E tests
        if: matrix.test-type == 'e2e'
        id: test-e2e
        continue-on-error: true
        run: |
          echo "📋【ステップ 1】Playwright ブラウザをインストール..."
          npx playwright install --with-deps chromium
          
          echo "✅【ステップ 2】インストール確認..."
          npx playwright --version
          
          echo "📂 キャッシュディレクトリを確認:"
          ls -la ~/.cache/ms-playwright/chromium* 2>/dev/null || echo "❌ Chromium が見つかりません"
          find ~/.cache/ms-playwright -name "chrome-headless-shell*" -o -name "chromium*" | head -5
          
          echo ""
          echo "⚠️【ステップ 3】ブラウザバイナリの権限を確認..."
          find ~/.cache/ms-playwright -type f -executable -name "chrome*" | head -3
          
          echo ""
          echo "🚀【ステップ 4】E2E テスト実行..."
          echo "   • フロントエンド: npm run dev --workspace frontend (port 5173)"
          echo "   • バックエンド: npm run start --workspace backend (port 3000)"
          echo "   • テストが自動でサーバーを起動します（playwright.config.js の webServer 設定）"
          echo ""
          
          npm run test:e2e 2>&1 | tee /tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log
          
          echo ""
          echo "✅ E2E test execution completed"
          echo "📊 Test results saved to /tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log"
      
      - name: Run advanced tests
        if: matrix.test-type == 'advanced'
        id: test-advanced
        continue-on-error: true
        run: npm run test:advanced 2>&1 | tee /tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log
      
      - name: Parse test results
        id: parse_results
        continue-on-error: true
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const logFile = '/tmp/test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.log';
          
          let result = {
            test_type: '${{ matrix.test-type }}',
            node_version: '${{ matrix.node-version }}',
            status: 'unknown',
            passed: 0,
            failed: 0,
            skipped: 0,
            timestamp: new Date().toISOString()
          };
          
          if (fs.existsSync(logFile)) {
            const content = fs.readFileSync(logFile, 'utf-8');
            
            // Match Vitest, Node test runner, and Mocha output formats
            const vitestPass = content.match(/✓\s+(\d+)\s+passed/);
            const vitestFail = content.match(/✖\s+(\d+)\s+failed/);
            const vitestSkip = content.match(/⊘\s+(\d+)\s+skipped/);
            
            const mochaPass = content.match(/(\d+)\s+passing/);
            const mochaFail = content.match(/(\d+)\s+failing/);
            const mochaSkip = content.match(/(\d+)\s+pending/);
            
            const nodePass = content.match(/tests\s+(\d+)/);
            const nodeFail = content.match(/failures\s+(\d+)/);
            
            // Try Vitest format first (modern default)
            result.passed = vitestPass ? parseInt(vitestPass[1]) : (mochaPass ? parseInt(mochaPass[1]) : 0);
            result.failed = vitestFail ? parseInt(vitestFail[1]) : (mochaFail ? parseInt(mochaFail[1]) : 0);
            result.skipped = vitestSkip ? parseInt(vitestSkip[1]) : (mochaSkip ? parseInt(mochaSkip[1]) : 0);
            
            // For Playwright (E2E), look for "passed/failed" pattern
            if ('${{ matrix.test-type }}' === 'e2e') {
              const pwPass = content.match(/(\d+)\s+passed/);
              const pwFail = content.match(/(\d+)\s+failed/);
              result.passed = pwPass ? parseInt(pwPass[1]) : 0;
              result.failed = pwFail ? parseInt(pwFail[1]) : 0;
            }
            
            result.status = result.failed === 0 ? 'passed' : 'failed';
          } else {
            result.status = 'error';
          }
          
          // Write JSON result
          fs.writeFileSync('test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.json', JSON.stringify(result));
          
          // Output result to GitHub Actions environment
          const output = `status=${result.status}\npassed=${result.passed}\nfailed=${result.failed}\n`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, output);
          
          console.log('Test Results:', JSON.stringify(result));
          EOF
      
      - name: Verify test result file was created
        run: |
          FILE="test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.json"
          if [ ! -f "$FILE" ]; then
            echo "❌ ERROR: Test result file not created: $FILE"
            echo "Current directory contents:"
            ls -la
            exit 1
          fi
          echo "✅ Test result file created: $FILE"
          cat "$FILE"
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}-${{ matrix.test-type }}
          path: test-result-${{ matrix.node-version }}-${{ matrix.test-type }}.json
          retention-days: 5
      
      - name: Upload Playwright report (E2E only)
        if: always() && matrix.test-type == 'e2e'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 5
      
      - name: Upload E2E test-results (E2E only)
        if: always() && matrix.test-type == 'e2e'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-node-${{ matrix.node-version }}
          path: test-results/
          retention-days: 5
  
  test-summary:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    
    steps:
      - name: Download all test results
        id: download_results
        uses: actions/download-artifact@v4
        with:
          path: test-results-all
      
      - name: Verify test results were downloaded
        run: |
          if [ ! -d "test-results-all" ] || [ -z "$(ls -A test-results-all 2>/dev/null)" ]; then
            echo "❌ ERROR: No test results downloaded"
            echo "Current directory contents:"
            ls -la
            exit 1
          fi
          echo "✅ Test results downloaded"
          echo "Contents of test-results-all:"
          find test-results-all -type f -exec echo "  - {}" \;
      
      - name: Generate test matrix summary
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          
          const resultsDir = 'test-results-all';
          const allResults = [];
          
          console.log('📂 Reading test results from:', resultsDir);
          if (!fs.existsSync(resultsDir)) {
            console.error('❌ Directory not found:', resultsDir);
            process.exit(1);
          }
          
          const dirs = fs.readdirSync(resultsDir);
          console.log('Found directories:', dirs);
          
          // Collect all test results
          for (const dir of dirs) {
            const dirPath = path.join(resultsDir, dir);
            console.log('  Processing:', dir);
            
            try {
              const files = fs.readdirSync(dirPath);
              console.log('    Files:', files);
              
              const jsonPath = path.join(dirPath, files[0]);
              const rawData = fs.readFileSync(jsonPath, 'utf-8');
              console.log('    Content:', rawData.substring(0, 200));
              
              const data = JSON.parse(rawData);
              console.log('    ✓ Parsed:', { test_type: data.test_type, node_version: data.node_version, passed: data.passed, failed: data.failed });
              allResults.push(data);
            } catch (e) {
              console.error('    ❌ Error:', e.message);
            }
          }
          
          console.log('\\n📊 Total results collected:', allResults.length);
          console.log('Results:', JSON.stringify(allResults.map(r => ({ test_type: r.test_type, passed: r.passed, failed: r.failed })), null, 2));
          
          // Generate summary
          const summary = {
            timestamp: new Date().toISOString(),
            total_combinations: allResults.length,
            passed_combinations: allResults.filter(r => r.status === 'passed').length,
            failed_combinations: allResults.filter(r => r.status === 'failed').length,
            total_tests: allResults.reduce((sum, r) => sum + (r.passed || 0) + (r.failed || 0), 0),
            total_passed: allResults.reduce((sum, r) => sum + (r.passed || 0), 0),
            total_failed: allResults.reduce((sum, r) => sum + (r.failed || 0), 0),
            by_node_version: {},
            by_test_type: {}
          };
          
          // Group by node version
          for (const version of [20]) {
            const versionResults = allResults.filter(r => r.node_version === version);
            summary.by_node_version[version] = {
              passed_tests: versionResults.reduce((sum, r) => sum + (r.passed || 0), 0),
              failed_tests: versionResults.reduce((sum, r) => sum + (r.failed || 0), 0),
              status: versionResults.every(r => r.status === 'passed') ? 'all_passed' : 'some_failed'
            };
          }
          
          // Group by test type
          for (const type of ['unit', 'api', 'e2e', 'advanced']) {
            const typeResults = allResults.filter(r => r.test_type === type);
            summary.by_test_type[type] = {
              passed_tests: typeResults.reduce((sum, r) => sum + (r.passed || 0), 0),
              failed_tests: typeResults.reduce((sum, r) => sum + (r.failed || 0), 0),
              status: typeResults.every(r => r.status === 'passed') ? 'all_passed' : 'some_failed'
            };
          }
          
          console.log('\\n✅ Test Matrix Summary:');
          console.log(JSON.stringify(summary, null, 2));
          
          fs.writeFileSync('test-matrix-summary.json', JSON.stringify(summary, null, 2));
          "
      
      - name: Upload test summary
        uses: actions/upload-artifact@v4
        with:
          name: test-matrix-summary
          path: test-matrix-summary.json
          retention-days: 5
      
      - name: Set test status output
        id: test_status
        run: |
          if [ -f test-matrix-summary.json ]; then
            STATUS=$(node -e "const data = require('./test-matrix-summary.json'); console.log(data.total_failed > 0 ? 'failed' : 'passed')")
            echo "status=$STATUS" >> $GITHUB_OUTPUT
          fi
        shell: bash
# Trigger test-matrix
