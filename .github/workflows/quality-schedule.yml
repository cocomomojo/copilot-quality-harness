name: Quality Schedule

on:
  schedule:
    # Friday 5:00 AM JST = Thursday 20:00 UTC
    - cron: '0 20 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write
  issues: write

jobs:
  scheduled-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      
      - name: Install dependencies
        run: npm install
      
      - name: Run all tests
        id: all_tests
        continue-on-error: true
        run: |
          echo "Running comprehensive test suite on Node ${{ matrix.node-version }}"
          npm test 2>&1 | tee /tmp/all-tests-${{ matrix.node-version }}.log
          npm run test:api 2>&1 | tee /tmp/all-tests-api-${{ matrix.node-version }}.log
          npm run test:advanced 2>&1 | tee /tmp/all-tests-advanced-${{ matrix.node-version }}.log
      
      - name: Run E2E tests
        id: e2e_tests
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e 2>&1 | tee /tmp/e2e-tests-${{ matrix.node-version }}.log
      
      - name: Parse comprehensive results
        id: parse_results
        run: |
          node -e "
          const fs = require('fs');
          
          const results = {
            node_version: '${{ matrix.node-version }}',
            timestamp: new Date().toISOString(),
            test_suites: {}
          };
          
          const suites = ['all-tests', 'all-tests-api', 'all-tests-advanced', 'e2e-tests'];
          let totalPassed = 0, totalFailed = 0;
          
          for (const suite of suites) {
            const logFile = \`/tmp/\${suite}-${{ matrix.node-version }}.log\`;
            if (fs.existsSync(logFile)) {
              const content = fs.readFileSync(logFile, 'utf-8');
              const passMatch = content.match(/(\d+)\s+passing/);
              const failMatch = content.match(/(\d+)\s+failing/);
              
              const passed = passMatch ? parseInt(passMatch[1]) : 0;
              const failed = failMatch ? parseInt(failMatch[1]) : 0;
              
              results.test_suites[suite] = {
                passed,
                failed,
                status: failed === 0 ? 'passed' : 'failed'
              };
              
              totalPassed += passed;
              totalFailed += failed;
            }
          }
          
          results.summary = {
            total_passed: totalPassed,
            total_failed: totalFailed,
            pass_rate: totalPassed + totalFailed > 0 ? Math.round((totalPassed / (totalPassed + totalFailed)) * 100) : 100,
            status: totalFailed === 0 ? 'all_passed' : 'some_failed'
          };
          
          fs.writeFileSync(\`comprehensive-results-${{ matrix.node-version }}.json\`, JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results, null, 2));
          console.log('::set-output name=status::' + results.summary.status);
          console.log('::set-output name=pass_rate::' + results.summary.pass_rate);
          "
      
      - name: Upload comprehensive results
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-test-results-node-${{ matrix.node-version }}
          path: comprehensive-results-${{ matrix.node-version }}.json
          retention-days: 30
  
  quality-validation:
    runs-on: ubuntu-latest
    needs: scheduled-tests
    if: always()
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: scheduled-results
      
      - name: Analyze quality metrics
        id: analyze
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          
          const resultsDir = 'scheduled-results';
          let allResults = [];
          
          try {
            for (const dir of fs.readdirSync(resultsDir)) {
              const dirPath = path.join(resultsDir, dir);
              if (fs.statSync(dirPath).isDirectory()) {
                for (const file of fs.readdirSync(dirPath)) {
                  if (file.endsWith('.json')) {
                    const data = JSON.parse(fs.readFileSync(path.join(dirPath, file), 'utf-8'));
                    allResults.push(data);
                  }
                }
              }
            }
          } catch (e) {
            console.error('Error reading results:', e);
          }
          
          const analysis = {
            timestamp: new Date().toISOString(),
            total_results: allResults.length,
            all_passed: allResults.every(r => r.summary.status === 'all_passed'),
            average_pass_rate: allResults.length > 0 
              ? Math.round(allResults.reduce((sum, r) => sum + r.summary.pass_rate, 0) / allResults.length)
              : 100,
            by_node_version: {}
          };
          
          for (const result of allResults) {
            analysis.by_node_version[result.node_version] = result.summary;
          }
          
          fs.writeFileSync('scheduled-analysis.json', JSON.stringify(analysis, null, 2));
          console.log('Quality Analysis:');
          console.log(JSON.stringify(analysis, null, 2));
          console.log('::set-output name=all_passed::' + (analysis.all_passed ? 'true' : 'false'));
          console.log('::set-output name=pass_rate::' + analysis.average_pass_rate);
          "
      
      - name: Create issue if critical gaps found
        if: steps.analyze.outputs.all_passed == 'false'
        uses: actions/github-script@v6
        with:
          script: |
            const passRate = ${{ steps.analyze.outputs.pass_rate }};
            
            const body = \`## 🚨 Scheduled Quality Check Failed
            
**Date**: \${new Date().toISOString()}
**Average Pass Rate**: \${passRate}%

### Action Required
- Review test failures in the scheduled quality run
- Check the workflow artifacts for detailed results
- Address critical issues before next scheduled run

### Workflow
- [View full results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
\`;
            
            try {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Scheduled Quality Check Failed',
                body: body,
                labels: ['ci-failure', 'quality-check']
              });
              
              console.log('Created issue:', issue.data.number);
            } catch (e) {
              console.error('Could not create issue:', e.message);
            }
      
      - name: Upload quality analysis
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-quality-analysis
          path: scheduled-analysis.json
          retention-days: 30
      
      - name: Report summary
        run: |
          echo "## 📅 Scheduled Quality Check Complete"
          echo ""
          echo "✅ All tests passed: ${{ steps.analyze.outputs.all_passed }}"
          echo "📈 Average pass rate: ${{ steps.analyze.outputs.pass_rate }}%"
          echo ""
          echo "View detailed results in artifacts"
