name: Spec-to-Implementation (統合型自動生成)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number with acceptance criteria (Given/When/Then format)'
        required: false
        type: string
      spec_file:
        description: 'Path to spec file (e.g., tests/specs/user-registration.yml)'
        required: false
        type: string
      quality_items_artifact:
        description: 'Quality items artifact name from generate-quality-items workflow (e.g., quality-items-simple)'
        required: false
        type: string
      quality_items_run_id:
        description: 'GitHub Run ID from generate-quality-items workflow to download artifact'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  # ============================================================
  # ステップ 1: Issue から YML 仕様を生成、または既存の spec_file を使用
  # ============================================================
  generate-spec-yml:
    name: Generate test spec from Issue or use provided spec file
    runs-on: ubuntu-latest
    outputs:
      spec_file: ${{ steps.final-spec-output.outputs.spec_file || steps.resolve-spec.outputs.spec_file }}
      feature_name: ${{ steps.generate.outputs.feature_name || steps.resolve-spec.outputs.feature_name }}
      quality_items_path: ${{ steps.download-quality-items.outputs.artifact_path }}
      quality_items_manifest: ${{ steps.download-quality-items.outputs.manifest_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve spec file
        id: resolve-spec
        run: |
          if [ -n "${{ inputs.spec_file }}" ]; then
            echo "spec_file=${{ inputs.spec_file }}" >> "$GITHUB_OUTPUT"
            echo "source=provided" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.issue_number }}" ]; then
            echo "source=generated" >> "$GITHUB_OUTPUT"
          else
            echo "Error: Either spec_file or issue_number must be provided"
            exit 1
          fi

      - name: Download quality items artifact (if provided)
        if: inputs.quality_items_artifact != '' && inputs.quality_items_run_id != ''
        id: download-quality-items
        run: |
          echo "📦 Downloading quality items artifact..."
          echo "Artifact: ${{ inputs.quality_items_artifact }}"
          echo "Run ID: ${{ inputs.quality_items_run_id }}"
          
          mkdir -p qa/quality-items-input
          gh run download "${{ inputs.quality_items_run_id }}" \
            --name "${{ inputs.quality_items_artifact }}" \
            --dir qa/quality-items-input
          
          # Output paths for next steps
          echo "artifact_path=qa/quality-items-input" >> "$GITHUB_OUTPUT"
          echo "manifest_path=qa/quality-items-input/manifest.json" >> "$GITHUB_OUTPUT"
          
          echo ""
          echo "✅ Quality items downloaded successfully"
          if [ -f qa/quality-items-input/manifest.json ]; then
            echo ""
            echo "📋 Manifest content:"
            cat qa/quality-items-input/manifest.json
          fi
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Fetch Issue from GitHub
        if: steps.resolve-spec.outputs.source == 'generated'
        id: fetch_issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > /tmp/issue.json
          echo "issue_file=/tmp/issue.json" >> "$GITHUB_OUTPUT"

      - name: Generate test spec YAML from Issue
        if: steps.resolve-spec.outputs.source == 'generated'
        id: generate
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_FILE: /tmp/issue.json
          REPO_ROOT: ${{ github.workspace }}
        run: |
          node scripts/generate-spec-from-issue.mjs \
            --issue-file "$ISSUE_FILE" \
            --issue-number "$ISSUE_NUMBER" \
            --repo-root "$REPO_ROOT" \
            --output-dir "tests/specs"

      - name: Update spec_file output if generated
        id: final-spec-output
        run: |
          if [ "${{ steps.resolve-spec.outputs.source }}" == "generated" ]; then
            echo "spec_file=${{ steps.generate.outputs.spec_file }}" >> "$GITHUB_OUTPUT"
            echo "feature_name=${{ steps.generate.outputs.feature_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.spec_file }}" ]; then
            echo "spec_file=${{ inputs.spec_file }}" >> "$GITHUB_OUTPUT"
            echo "Using provided spec_file: ${{ inputs.spec_file }}"
          fi

      - name: Upload generated spec as artifact
        if: steps.resolve-spec.outputs.source == 'generated'
        uses: actions/upload-artifact@v4
        with:
          name: generated-spec
          path: tests/specs/
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit generated YML to branch
        if: steps.resolve-spec.outputs.source == 'generated'
        env:
          GIT_AUTHOR_NAME: Copilot
          GIT_AUTHOR_EMAIL: copilot@github.com
          SPEC_FILE: ${{ steps.generate.outputs.spec_file }}
        run: |
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add "$SPEC_FILE"
          git commit -m "feat: Auto-generate test spec YML from Issue #${{ inputs.issue_number }}" \
            --no-verify || echo "No changes to commit"
          git push origin HEAD --no-verify || echo "Push failed or no changes"

  # ============================================================
  # ステップ 2: YML から 実装+UT+E2E を自動生成
  # ============================================================
  generate-implementation:
    name: Generate implementation and tests
    needs: generate-spec-yml
    runs-on: ubuntu-latest
    outputs:
      pr_url: ${{ steps.create_pr.outputs.pull_request_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download generated spec artifact (only if M2 generated it)
        if: ${{ inputs.spec_file == '' && inputs.issue_number != '' }}
        uses: actions/download-artifact@v4
        with:
          name: generated-spec
          path: tests/specs
        continue-on-error: true

      - name: Validate generated spec file
        id: validate_spec
        env:
          SPEC_FILE: ${{ needs.generate-spec-yml.outputs.spec_file }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          echo "🔍 Validating spec file..."
          VALIDATION_RESULT=$(node scripts/workflow-error-handler.mjs validate-spec "$SPEC_FILE" "$ISSUE_NUMBER" 2>&1)
          echo "$VALIDATION_RESULT" | tee /tmp/validation_result.json
          
          # Check if validation passed
          if ! echo "$VALIDATION_RESULT" | grep -q '"valid": true'; then
            echo "❌ Spec validation failed"
            echo "validation_passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          
          echo "✅ Spec validation passed"
          echo "validation_passed=true" >> "$GITHUB_OUTPUT"

      - name: Generate implementation code from spec
        id: impl_gen
        env:
          SPEC_FILE: ${{ needs.generate-spec-yml.outputs.spec_file }}
          FEATURE_NAME: ${{ needs.generate-spec-yml.outputs.feature_name }}
          REPO_ROOT: ${{ github.workspace }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          set +e
          
          echo "🔍 DEBUG: Job outputs received"
          echo "  spec_file=$SPEC_FILE"
          echo "  feature_name=$FEATURE_NAME"
          echo "  issue_number=$ISSUE_NUMBER"
          
          if [ -z "$SPEC_FILE" ]; then
            echo "⚠️ WARNING: SPEC_FILE is empty. Checking for downloaded artifact..."
            if [ -f "web.yml" ]; then
              echo "✅ Found web.yml in current directory"
              SPEC_FILE="web.yml"
            elif [ -f "tests/specs/web.yml" ]; then
              echo "✅ Found tests/specs/web.yml"
              SPEC_FILE="tests/specs/web.yml"
            elif find . -maxdepth 3 -name "*.yml" -type f | grep -q .; then
              echo "Found YML files:"
              find . -maxdepth 3 -name "*.yml" -type f
              SPEC_FILE=$(find . -maxdepth 3 -name "*.yml" -type f | sort | tail -n 1)
              echo "✅ Using: $SPEC_FILE"
            else
              echo "❌ Error: No YML files found. Regenerating from issue..."
              if [ -z "$ISSUE_NUMBER" ]; then
                echo "Error: ISSUE_NUMBER is required when the spec artifact is unavailable." >&2
                node scripts/workflow-error-handler.mjs capture-error "TEST_GENERATION_FAILED" "ISSUE_NUMBER is required but was not provided"
                exit 1
              fi
              gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > /tmp/issue.json
              node scripts/generate-spec-from-issue.mjs \
                --issue-file /tmp/issue.json \
                --issue-number "$ISSUE_NUMBER" \
                --repo-root "$REPO_ROOT" \
                --output-dir "tests/specs"

              LATEST_SPEC=$(find "$REPO_ROOT/tests/specs" -maxdepth 1 -type f -name '*.yml' -print | sort | tail -n 1)
              if [ -n "$LATEST_SPEC" ]; then
                SPEC_FILE="${LATEST_SPEC#$REPO_ROOT/}"
                echo "✅ Using regenerated spec file: $SPEC_FILE"
              fi
            fi
          fi

          if [ ! -f "$SPEC_FILE" ]; then
            echo "❌ Error: Spec file still not found after all attempts: $SPEC_FILE" >&2
            node scripts/workflow-error-handler.mjs capture-error "TEST_GENERATION_FAILED" "Spec file not found: $SPEC_FILE" "{\"issue_number\": \"$ISSUE_NUMBER\"}"
            exit 1
          fi

          echo "✅ Using spec file: $SPEC_FILE"
          
          # Step 1: Generate implementation code from spec with timeout
          echo ""
          echo "📝 Step 1: Generating implementation code..."
          timeout 300 pnpm exec ts-node scripts/generate-implementation-from-spec.ts "$SPEC_FILE"
          IMPL_STATUS=$?
          
          if [ $IMPL_STATUS -ne 0 ]; then
            echo "❌ Error: Implementation generation failed with status $IMPL_STATUS" >&2
            node scripts/workflow-error-handler.mjs capture-error "TEST_GENERATION_FAILED" "Implementation generation failed with exit code $IMPL_STATUS" "{\"issue_number\": \"$ISSUE_NUMBER\", \"spec_file\": \"$SPEC_FILE\"}"
            exit 1
          fi
          
          echo "✅ Implementation code generated successfully"
          
          # Step 2: Generate tests from spec with timeout
          echo ""
          echo "📝 Step 2: Generating test code..."
          timeout 300 pnpm exec ts-node scripts/generate-tests-from-spec.ts "$SPEC_FILE"
          GEN_STATUS=$?
          
          if [ $GEN_STATUS -ne 0 ]; then
            echo "❌ Error: Test generation failed with status $GEN_STATUS" >&2
            node scripts/workflow-error-handler.mjs capture-error "TEST_GENERATION_FAILED" "Test generation failed with exit code $GEN_STATUS" "{\"issue_number\": \"$ISSUE_NUMBER\", \"spec_file\": \"$SPEC_FILE\"}"
            exit 1
          fi
          
          echo "✅ Test code generated successfully"
          set -e

      - name: List generated files
        run: |
          echo "=== Generated Implementation files ==="
          find frontend/src/components -name "*.jsx" -o -name "*.css" 2>/dev/null | sort || true
          echo ""
          echo "=== Generated UT files ==="
          find . -name "*.spec.ts" -path "*/unit/*" -newer /tmp/issue.json 2>/dev/null || true
          echo ""
          echo "=== Generated E2E files ==="
          find . -name "*.spec.ts" -path "*/e2e/*" -newer /tmp/issue.json 2>/dev/null || true
          echo "=== Generated implementation files ==="
          find . -path "*/node_modules" -prune -o -name "*.jsx" -o -name "*.tsx" -newer /tmp/issue.json -print 2>/dev/null || true

      - name: Validate generated artifacts
        id: validate_artifacts
        run: |
          echo "🔍 Validating generated artifacts..."
          set +e
          
          # Count implementation files
          IMPL_COUNT=$(find frontend/src/components -type f \( -name "*.jsx" -o -name "*.css" \) 2>/dev/null | wc -l)
          echo "📊 Implementation files: $IMPL_COUNT"
          
          # Count test files
          UNIT_TEST_COUNT=$(find src/tests/unit tests/unit -type f -name "*.spec.ts" -o -name "*.spec.js" 2>/dev/null | wc -l)
          E2E_TEST_COUNT=$(find tests/e2e -type f -name "*.spec.ts" -o -name "*.spec.js" 2>/dev/null | wc -l)
          FIXTURE_COUNT=$(find tests/fixtures -type f -name "*-mocks.ts" -o -name "*-mocks.js" 2>/dev/null | wc -l)
          
          TOTAL_TEST_COUNT=$((UNIT_TEST_COUNT + E2E_TEST_COUNT + FIXTURE_COUNT))
          echo "📊 Test files: $TOTAL_TEST_COUNT (Unit: $UNIT_TEST_COUNT, E2E: $E2E_TEST_COUNT, Fixtures: $FIXTURE_COUNT)"
          
          # Validation logic
          VALIDATION_PASSED=true
          
          # 実装ファイルが少なくとも1つは必要
          if [ $IMPL_COUNT -lt 1 ]; then
            echo "⚠️ WARNING: No implementation files generated (expected ≥1, got $IMPL_COUNT)"
            echo "   This may occur when implementation was already done manually."
            VALIDATION_PASSED=false
          else
            echo "✅ Implementation files found: $IMPL_COUNT"
          fi
          
          # テストファイルが少なくとも1つは必要
          if [ $TOTAL_TEST_COUNT -lt 1 ]; then
            echo "⚠️ WARNING: No test files generated (expected ≥1, got $TOTAL_TEST_COUNT)"
            VALIDATION_PASSED=false
          else
            echo "✅ Test files found: $TOTAL_TEST_COUNT"
          fi
          
          # 実装とテストの両方が必要
          if [ $IMPL_COUNT -ge 1 ] && [ $TOTAL_TEST_COUNT -ge 1 ]; then
            echo "✅ Both implementation and test files generated successfully"
          else
            echo "⚠️ WARNING: Missing either implementation or test files"
            echo "   Implementation: $IMPL_COUNT, Tests: $TOTAL_TEST_COUNT"
            VALIDATION_PASSED=false
          fi
          
          if [ "$VALIDATION_PASSED" = "true" ]; then
            echo "✅ Artifact validation PASSED"
            echo "validation_passed=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "⚠️ Artifact validation skipped (no files generated)"
            echo "validation_passed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -e

      - name: Run tests to verify generation
        id: test_verify
        continue-on-error: true
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          echo "Running tests on generated code..."
          set +e
          
          # Run tests and capture output to file
          TEST_OUTPUT_FILE="/tmp/test_output.log"
          pnpm test 2>&1 | tee "$TEST_OUTPUT_FILE" | head -100
          TEST_STATUS=$?
          
          echo "📋 Analyzing test output..."
          VALIDATION_RESULT=$(node scripts/test-validation-helper.mjs check-test-output "$TEST_OUTPUT_FILE" 3 2>&1)
          echo "$VALIDATION_RESULT"
          
          # Save for later notification
          echo "$VALIDATION_RESULT" > /tmp/test_validation_result.json
          
          if [ $TEST_STATUS -eq 0 ]; then
            echo "✅ Tests completed successfully"
            echo "test_status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Tests exited with status $TEST_STATUS (may have placeholder tests)"
            echo "test_status=failed" >> "$GITHUB_OUTPUT"
          fi
          
          set -e

      - name: 🤖 AI-Powered E2E Test Auto-Healing Loop
        if: steps.test_verify.outputs.test_status == 'failed'
        id: ai_healer
        continue-on-error: true
        run: |
          echo "🔧 Starting AI-assisted E2E test auto-healing loop..."
          echo ""
          echo "Workflow:"
          echo "1. ✅ Detect E2E test failures"
          echo "2. ↳ Invoke Copilot AI agent"
          echo "3. ↳ AI analyzes failure patterns"
          echo "4. ↳ AI suggests and implements fixes"
          echo "5. ↳ Re-run tests"
          echo "6. ↳ If success → commit & continue"
          echo "7. ↳ If still failing → escalate"
          echo ""
          
          node scripts/e2e-auto-healing-loop.mjs heal-with-agent "${{ inputs.issue_number }}" 2>&1 | tee /tmp/healer_output.log
          HEALER_STATUS=$?
          
          if [ $HEALER_STATUS -eq 0 ]; then
            echo "✅ AI auto-healing successful"
            echo "ai_healer_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ AI auto-healing requires review/escalation"
            echo "ai_healer_status=needs_review" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify no test regressions
        if: steps.test_verify.outputs.test_status == 'failed' && steps.ai_healer.outputs.ai_healer_status != 'success'
        run: |
          echo "⚠️ WARNING: Test execution reported failures"
          echo ""
          echo "🤖 AI Auto-Healing Attempt Summary:"
          echo "   - Analyzed failure patterns"
          echo "   - Generated repair suggestions"
          echo "   - Awaiting AI agent execution"
          echo ""
          echo "This may indicate:"
          echo "1. Complex failures requiring manual intervention"
          echo "2. Test environment issues"
          echo "3. Generated code integration gaps"
          echo ""
          echo "🔧 Recommended actions:"
          echo "1. Review AI healer output in logs above"
          echo "2. Check failure patterns in test output"
          echo "3. Consider manual code review before merge"
          echo ""
          echo "The workflow will continue, but review carefully before merging."

      - name: Check artifact validation before PR creation
        if: steps.validate_artifacts.outputs.validation_passed != 'true'
        run: |
          echo "❌ WORKFLOW STOPPED: Artifact validation failed"
          echo ""
          echo "⚠️ The generated code does not meet quality requirements:"
          echo "   - Implementation files are missing or incomplete"
          echo "   - Test files are missing or incomplete"
          echo ""
          echo "Please review the 'Validate generated artifacts' step output above."
          echo ""
          echo "🔧 To fix this issue:"
          echo "   1. Check that both generate-implementation-from-spec.ts and generate-tests-from-spec.ts executed successfully"
          echo "   2. Verify the spec file (YAML) contains all required information"
          echo "   3. Check GitHub Actions logs for generation errors"
          echo ""
          exit 1

      - name: Create PR with generated code
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          FEATURE_NAME: ${{ needs.generate-spec-yml.outputs.feature_name }}
          BRANCH_NAME: copilot/impl-issue-${{ inputs.issue_number }}
        run: |
          # Skip if an open PR already exists for this issue or a related branch
          EXISTING_PR_NUMBER=$(gh pr list --state open --limit 100 --json number,title,body,headRefName --jq '.[] | select((.title|test("Issue #" + env.ISSUE_NUMBER; "i")) or (.body|test("#" + env.ISSUE_NUMBER; "i")) or (.headRefName == "copilot/impl-issue-" + env.ISSUE_NUMBER)) | .number' 2>/dev/null | head -n 1)
          if [ -n "$EXISTING_PR_NUMBER" ]; then
            EXISTING_PR_URL="https://github.com/${GITHUB_REPOSITORY}/pull/${EXISTING_PR_NUMBER}"
            echo "Existing PR already found for Issue #${ISSUE_NUMBER}: ${EXISTING_PR_URL}"
            echo "pull_request_url=$EXISTING_PR_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Create feature branch
          git config user.name "Copilot"
          git config user.email "copilot@github.com"
          
          # Delete remote branch if it exists (to start fresh)
          git push origin --delete "$BRANCH_NAME" 2>/dev/null || true
          
          # Delete local branch if it exists
          git branch -D "$BRANCH_NAME" 2>/dev/null || true
          
          # Create new feature branch from main
          git checkout -b "$BRANCH_NAME"
          
          # Stage all generated files
          git add -A
          
          # Verify staged files
          echo "📋 Verifying staged files before commit..."
          STAGED_FILES=$(git diff --cached --name-only | wc -l)
          IMPL_STAGED=$(git diff --cached --name-only | grep -E "\.jsx|\.tsx|\.css" | wc -l)
          TEST_STAGED=$(git diff --cached --name-only | grep -E "\.spec\.(ts|js)|-mocks\.(ts|js)" | wc -l)
          
          echo "   Total staged files: $STAGED_FILES"
          echo "   Implementation files: $IMPL_STAGED"
          echo "   Test files: $TEST_STAGED"
          
          if [ $STAGED_FILES -lt 2 ]; then
            echo "⚠️ WARNING: Too few files staged for commit ($STAGED_FILES). Skipping commit."
            echo "   This may occur when implementation was already done manually."
            exit 0
          fi
          
          if [ $IMPL_STAGED -lt 1 ]; then
            echo "⚠️ WARNING: No implementation files staged. Skipping commit."
            echo "   This may occur when implementation was already done manually."
            exit 0
          fi
          
          if [ $TEST_STAGED -lt 1 ]; then
            echo "⚠️ WARNING: No test files staged. Skipping commit."
            exit 0
          fi
          
          echo "✅ Staged files validation passed"
          
          # Commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "feat: Auto-generate implementation, UT, and E2E tests for Issue #${ISSUE_NUMBER}" \
              --no-verify
            
            # Push new branch with retry logic
            PUSH_ATTEMPTS=0
            PUSH_MAX_ATTEMPTS=3
            PUSH_BACKOFF=5
            
            while [ $PUSH_ATTEMPTS -lt $PUSH_MAX_ATTEMPTS ]; do
              PUSH_ATTEMPTS=$((PUSH_ATTEMPTS + 1))
              echo "🔄 Push attempt $PUSH_ATTEMPTS/$PUSH_MAX_ATTEMPTS..."
              
              if git push origin "$BRANCH_NAME" --no-verify 2>&1 | tee /tmp/push_output.txt; then
                echo "✅ Branch pushed successfully: $BRANCH_NAME"
                break
              else
                PUSH_ERROR=$(cat /tmp/push_output.txt | tail -5)
                echo "❌ Push failed: $PUSH_ERROR"
                
                if [ $PUSH_ATTEMPTS -lt $PUSH_MAX_ATTEMPTS ]; then
                  echo "⏳ Waiting ${PUSH_BACKOFF}s before retry..."
                  sleep $PUSH_BACKOFF
                  # Try to clean up before retry
                  git push origin --delete "$BRANCH_NAME" 2>/dev/null || true
                  sleep 2
                else
                  echo "❌ Error: Push failed after $PUSH_MAX_ATTEMPTS attempts"
                  node scripts/workflow-error-handler.mjs capture-error "GIT_PUSH_FAILED" "Failed to push branch after $PUSH_MAX_ATTEMPTS attempts" "{\"branch\": \"$BRANCH_NAME\", \"error\": \"$PUSH_ERROR\"}"
                  exit 1
                fi
              fi
            done
            
            # Create PR with simplified body
            echo "🔄 Attempting to create PR..."
            PR_URL=$(gh pr create \
              --title "【自動生成】Issue #${ISSUE_NUMBER}: ${FEATURE_NAME} の実装+テスト" \
              --body "Auto-generated implementation, unit tests, and E2E tests based on Issue #${ISSUE_NUMBER} specifications." \
              --head "$BRANCH_NAME" \
              --base main \
              --draft \
              --label "auto-generated,implementation" 2>&1 | tee /tmp/pr_output.txt | grep -oP 'https://github\.com/[^/]+/[^/]+/pull/\d+' || echo "")
            
            echo "📍 PR_URL captured: '$PR_URL'"
            echo "pull_request_url=$PR_URL" >> "$GITHUB_OUTPUT"
          else
            echo "No changes generated, skipping PR creation"
            echo "pull_request_url=" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # ステップ 3: サマリーと通知
  # ============================================================
  summary:
    name: Summary and notification
    needs: [generate-spec-yml, generate-implementation]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report completion
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          SPEC_FILE: ${{ needs.generate-spec-yml.outputs.spec_file }}
          PR_URL: ${{ needs.generate-implementation.outputs.pr_url }}
        run: |
          echo "## ✅ 自動生成完了"
          echo ""
          echo "### 生成結果"
          echo "- **Issue**: #${ISSUE_NUMBER}"
          echo "- **Spec YML**: ${SPEC_FILE}"
          if [ -n "$PR_URL" ]; then
            echo "- **PR**: ${PR_URL}"
          else
            echo "- **PR**: No changes generated"
          fi
          echo ""
          echo "### 次のステップ"
          if [ -n "$PR_URL" ]; then
            echo "1. Review the PR: ${PR_URL}"
            echo "2. Adjust auto-generated code as needed"
            echo "3. Run full test suite before merge"
            echo "4. Merge when ready"
          else
            echo "1. Check the generated spec YML file"
            echo "2. Verify content matches Issue requirements"
            echo "3. Manually trigger implementation generation if needed"
          fi

      - name: Check for workflow errors and post if any
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const issueNumber = process.env.ISSUE_NUMBER;
            const jobStatus = process.env.JOB_STATUS;
            
            // Check for error log file
            const errorLogPath = '/tmp/workflow_errors.json';
            if (!fs.existsSync(errorLogPath)) {
              console.log('No error log found');
              return;
            }
            
            try {
              const errors = JSON.parse(fs.readFileSync(errorLogPath, 'utf-8'));
              if (!errors || errors.length === 0) {
                console.log('No errors recorded');
                return;
              }
              
              const latestError = errors[errors.length - 1];
              console.log('Found error:', latestError);
              
              // Generate error notification message
              let message = `## ⚠️ ワークフロー実行エラー\n\n`;
              message += `**エラータイプ**: \`${latestError.type}\`\n`;
              message += `**メッセージ**: ${latestError.message}\n`;
              message += `**実行ID**: [${latestError.workflowRunId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${latestError.workflowRunId})\n\n`;
              
              if (latestError.context) {
                message += `### コンテキスト情報\n`;
                message += `\`\`\`json\n`;
                message += JSON.stringify(latestError.context, null, 2);
                message += `\n\`\`\`\n\n`;
              }
              
              message += `### 推奨アクション\n`;
              message += `1. [ワークフロー実行ログ](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${latestError.workflowRunId}) を確認\n`;
              message += `2. エラー内容に基づいて Issue の受入条件を確認・修正\n`;
              message += `3. ワークフローを再実行\n\n`;
              message += `*このメッセージは自動生成されました*`;
              
              // Post comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber),
                body: message
              });
              
              console.log('Error notification posted');
            } catch (err) {
              console.error('Error processing error log:', err);
            }

      - name: Post comment on Issue
        if: always()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          SPEC_FILE: ${{ needs.generate-spec-yml.outputs.spec_file }}
          PR_URL: ${{ needs.generate-implementation.outputs.pr_url }}
        with:
          script: |
            const issueNumber = process.env.ISSUE_NUMBER;
            const specFile = process.env.SPEC_FILE;
            const prUrl = process.env.PR_URL;
            
            let message = `## 🤖 自動生成完了 (Spec-to-Implementation)\n\n`;
            message += `✅ テスト仕様 YML を生成しました: \`${specFile}\`\n\n`;
            if (prUrl) {
              message += `✅ 実装 + UT + E2E テストの PR を作成しました: ${prUrl}\n\n`;
            } else {
              message += `⚠️ 追加の変更がない、またはエラーが発生しました。ワークフローのログを確認してください。\n\n`;
            }
            message += `### 次のステップ\n`;
            if (prUrl) {
              message += `1. [PR](${prUrl}) をレビュー\n`;
              message += `2. 自動生成コードを必要に応じて調整\n`;
              message += `3. テストスイート全体を実行\n`;
              message += `4. マージ\n`;
            } else {
              message += `1. 生成された YML ファイルを確認\n`;
              message += `2. Issue の要件に合致しているか確認\n`;
              message += `3. 必要に応じて手動で実装を進める\n`;
            }
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber),
              body: message
            });
