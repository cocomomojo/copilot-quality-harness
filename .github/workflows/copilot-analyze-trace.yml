name: Playwright トレース解析（Copilot 修正案生成）

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: 'Trace artifact 名（例: playwright-report）'
        required: false
        type: string
        default: 'playwright-report'
      artifact_id:
        description: 'Artifact ID（オプション、指定時はこちらを優先）'
        required: false
        type: string

  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'e2e/**'
      - 'playwright.config.js'
      - 'frontend/**'
      - 'backend/**'

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  analyze-trace:
    name: Analyze Playwright Trace & Generate Copilot Suggestions
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⬇️ Download Trace Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_id || inputs.artifact_name }}
          path: ./trace-artifacts
        continue-on-error: true

      - name: 🔍 List Downloaded Artifacts
        run: |
          echo "Downloaded artifacts:"
          find ./trace-artifacts -type f || echo "No artifacts found"

      - name: 📊 Generate Trace Summary
        id: trace_summary
        run: |
          # trace ファイルを探す
          TRACE_FILE=$(find ./trace-artifacts -name "*.trace" -o -name "trace.json" | head -1)
          
          if [ -z "$TRACE_FILE" ]; then
            echo "⚠️ Warning: No trace file found"
            echo "trace_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "✅ Found trace file: $TRACE_FILE"
          echo "trace_found=true" >> $GITHUB_OUTPUT
          echo "trace_file=$TRACE_FILE" >> $GITHUB_OUTPUT
          
          # trace-summary.ts を実行
          npx ts-node scripts/trace-summary.ts "$TRACE_FILE"
          
          # trace-summary.json が生成されたか確認
          if [ -f "./trace-artifacts/trace-summary.json" ]; then
            echo "✅ trace-summary.json generated successfully"
            cat ./trace-artifacts/trace-summary.json
          else
            echo "❌ Failed to generate trace-summary.json"
            exit 1
          fi

      - name: 📋 Prepare Copilot Input
        if: steps.trace_summary.outputs.trace_found == 'true'
        id: copilot_input
        run: |
          # trace-summary.json を読み込み
          TRACE_SUMMARY=$(cat ./trace-artifacts/trace-summary.json)
          
          # Copilot に渡す JSON を生成
          cat > ./copilot-request.json <<'EOF'
          {
            "repo": "cocomomojo/copilot-quality-harness",
            "trace_summary": $TRACE_SUMMARY,
            "constraints": {
              "language": "ja",
              "max_solutions": 3,
              "max_log_chars": 2000,
              "no_auto_commit": true
            }
          }
          EOF
          
          echo "✅ Copilot request prepared"
          cat ./copilot-request.json

      - name: 🚀 Install Copilot CLI
        if: steps.trace_summary.outputs.trace_found == 'true'
        run: |
          echo "Installing Copilot CLI..."
          curl -fsSL https://gh.io/copilot-install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
          # Verify installation
          $HOME/.local/bin/copilot --version

      - name: 🤖 Run Copilot Dynamic Workflow
        if: steps.trace_summary.outputs.trace_found == 'true'
        id: copilot_analysis
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          echo "Running Copilot Dynamic Workflow..."
          
          # Check if COPILOT_GITHUB_TOKEN is set
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "❌ ERROR: COPILOT_GITHUB_TOKEN is not set"
            echo "Please add COPILOT_GITHUB_TOKEN to repository secrets"
            exit 1
          fi
          
          # Run Copilot workflow
          $HOME/.local/bin/copilot --experimental --allow-tool=read \
            workflow run analyze-trace-workflow \
            --args @./trace-artifacts/trace-summary.json \
            --output-format json \
            > ./trace-artifacts/analysis.json 2>&1 || {
            echo "❌ Copilot workflow failed"
            cat ./trace-artifacts/analysis.json || echo "No output"
            exit 1
          }
          
          # Verify analysis.json was created and has content
          if [ -f "./trace-artifacts/analysis.json" ] && [ -s "./trace-artifacts/analysis.json" ]; then
            echo "✅ Copilot analysis generated successfully"
            cat ./trace-artifacts/analysis.json
          else
            echo "❌ Failed to generate analysis.json or output is empty"
            exit 1
          fi

      - name: 📝 Generate Draft PR
        if: steps.trace_summary.outputs.trace_found == 'true'
        id: pr_generation
        run: |
          echo "Generating Draft PR..."
          npx ts-node scripts/create-draft-pr.ts

      - name: 💬 Post Comment on PR (Phase 2C)
        if: github.event_name == 'pull_request' && steps.trace_summary.outputs.trace_found == 'true'
        id: pr_comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Posting Copilot analysis as comment on PR..."
          npx ts-node scripts/post-pr-comment.ts

      - name: ✨ Workflow Complete
        if: success()
        run: |
          echo "✅ Playwright トレース解析ワークフロー完了"
          echo "📋 成果物:"
          echo "  - trace-summary.json: トレース要約"
          echo "  - analysis.json: Copilot 分析結果"
          echo "  - Draft PR: 修正提案（人間レビュー必須）"
          echo ""
          echo "⚠️ 重要: Draft PR は自動マージされません"
          echo "必ず人間がレビューしてから対応してください"
