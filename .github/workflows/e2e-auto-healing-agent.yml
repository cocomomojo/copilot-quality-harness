name: E2E Test Auto-Healing with AI Agent

on:
  workflow_run:
    workflows: ['Spec-to-Implementation (統合型自動生成)']
    types: [completed]
    branches: ['main']

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read

jobs:
  ai-heal-e2e:
    name: 🤖 AI E2E Test Auto-Healing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check parent workflow status
        run: |
          echo "Parent workflow: ${{ github.event.workflow_run.name }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          
          if [ "${{ github.event.workflow_run.conclusion }}" = "failure" ]; then
            echo "🚨 Parent workflow failed - E2E healing may be needed"
          else
            echo "✅ Parent workflow passed - No healing needed"
            exit 0
          fi

      - name: Run AI E2E healing loop
        continue-on-error: true
        run: |
          echo "🤖 Invoking AI-powered E2E test healing..."
          node scripts/e2e-auto-healing-loop.mjs heal-with-agent 61

      - name: Verify test status
        continue-on-error: true
        run: |
          pnpm test 2>&1 | tail -20

      - name: Report summary
        if: always()
        run: |
          echo "========================================="
          echo "  AI E2E Test Auto-Healing Complete"
          echo "========================================="
          echo "Status: Ready for review"
