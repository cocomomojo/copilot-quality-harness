name: Update Quality Dashboard

on:
  schedule:
    # Daily at 10:00 AM JST (01:00 AM UTC)
    - cron: '0 1 * * *'
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Quality Schedule"]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect-kpi:
    runs-on: ubuntu-latest
    
    outputs:
      kpi_data: ${{ steps.collect.outputs.kpi_data }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Install dependencies
        run: npm install
      
      - name: Create data directory
        run: mkdir -p qa/dashboard-data
      
      - name: Download previous KPI history from artifacts
        continue-on-error: true
        run: |
          echo "Attempting to restore KPI history from previous runs..."
          
          # Get the latest 5 successful update-dashboard workflow runs
          RUNS=$(gh run list --workflow=update-dashboard.yml --limit=5 \
            --json databaseId,status,conclusion \
            --jq '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId')
          
          # Try to download kpi-data artifact from each run
          for RUN_ID in $RUNS; do
            echo "  Checking run: $RUN_ID"
            if gh run download "$RUN_ID" --name kpi-data --dir qa/dashboard-data 2>/dev/null; then
              if [ -f qa/dashboard-data/kpi-history.json ]; then
                echo "  ✓ Restored kpi-history.json from run $RUN_ID"
                exit 0
              fi
            fi
          done
          
          echo "  ⚠️  No previous KPI history found"
          exit 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download latest test results
        id: download
        continue-on-error: true
        run: |
          # Try to download artifacts from recent workflow runs
          gh run list --limit 5 --json conclusion,artifacts -q '.[].artifacts[]' > artifacts_list.json || echo "[]" > artifacts_list.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Collect KPI data (Advanced Pattern 3)
        id: collect
        run: node scripts/collect-kpi-advanced.mjs qa/dashboard-data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      
      - name: Upload KPI data
        uses: actions/upload-artifact@v4
        with:
          name: kpi-data
          path: qa/dashboard-data/
          retention-days: 30

  generate-dashboard:
    runs-on: ubuntu-latest
    needs: collect-kpi
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Install dependencies
        run: npm install
      
      - name: Download KPI data
        uses: actions/download-artifact@v4
        with:
          name: kpi-data
          path: qa/dashboard-data
      
      - name: Generate dashboard
        run: |
          mkdir -p docs/dashboard/data
          node scripts/generate-dashboard.mjs "qa/dashboard-data" "docs/dashboard" "Quality Dashboard"
          # Copy KPI data files for dynamic loading
          cp qa/dashboard-data/latest-kpi.json docs/dashboard/data/ 2>/dev/null || true
          cp qa/dashboard-data/kpi-history.json docs/dashboard/data/ 2>/dev/null || true
      
      - name: Download Playwright test results
        id: download_playwright
        continue-on-error: true
        run: |
          echo "🔍 Looking for latest test run artifacts..."
          
          # 最新のテストマトリックス実行を取得
          LATEST_TEST_RUN=$(gh run list --workflow test-matrix.yml --status completed --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo "")
          
          if [ -z "$LATEST_TEST_RUN" ]; then
            echo "⚠️  No previous test run found"
            exit 0
          fi
          
          echo "📥 Downloading artifacts from test run: $LATEST_TEST_RUN"
          
          # 指定された実行からアーティファクトをダウンロード
          mkdir -p ./artifacts
          
          # すべてのテスト結果アーティファクトをダウンロード
          echo "  • Downloading test-results-* artifacts..."
          gh run download "$LATEST_TEST_RUN" \
            --pattern "test-results-*" \
            --dir ./artifacts || echo "    (no test-results-* found)"
          
          # E2Eテスト結果を明示的にダウンロード
          echo "  • Downloading e2e-test-results-* artifacts..."
          gh run download "$LATEST_TEST_RUN" \
            --pattern "e2e-test-results-*" \
            --dir ./artifacts || echo "    (no e2e-test-results-* found)"
          
          # Playwrightレポートをダウンロード
          echo "  • Downloading playwright-report-* artifacts..."
          gh run download "$LATEST_TEST_RUN" \
            --pattern "playwright-report-*" \
            --dir ./artifacts || echo "    (no playwright-report-* found)"
          
          # 動画アーティファクトをダウンロード
          echo "  • Downloading e2e-videos-* artifacts..."
          gh run download "$LATEST_TEST_RUN" \
            --pattern "e2e-videos-*" \
            --dir ./artifacts || echo "    (no e2e-videos-* found)"
          
          echo "✅ Download complete"
          echo "📋 Artifacts downloaded:"
          find ./artifacts -type f -name "*.json" | head -20
          find ./artifacts -type d | head -20
          
          if [ ! "$(ls -A ./artifacts)" ]; then
            echo "⚠️  WARNING: No artifacts found from run $LATEST_TEST_RUN"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate E2E report
        id: e2e_report
        continue-on-error: true
        run: |
          echo "📊 Generating E2E test report..."
          npx ts-node scripts/generate-e2e-report.ts qa/e2e-report
          
          if [ -f qa/e2e-report/test-cases.json ]; then
            echo "✅ E2E report generated"
            mkdir -p docs/reports/data
            cp qa/e2e-report/test-cases.json docs/reports/data/ 2>/dev/null || true
          else
            echo "⚠️  E2E report not generated (no test results found)"
          fi
      
      - name: Generate E2E details page
        id: e2e_page
        continue-on-error: true
        run: |
          echo "🎬 Generating E2E details page..."
          node scripts/generate-e2e-details-page.mjs "qa/e2e-report/test-cases.json" "docs/reports"
          
          if [ -f docs/reports/e2e-latest.html ]; then
            echo "✅ E2E details page generated"
          else
            echo "⚠️  E2E details page generation skipped"
          fi
      
      - name: Verify dashboard
        run: |
          if [ -f docs/dashboard/index.html ]; then
            echo "✅ Dashboard HTML generated successfully"
            ls -lh docs/dashboard/
          else
            echo "❌ Dashboard generation failed"
            exit 1
          fi
      
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-html
          path: docs/dashboard/
          retention-days: 30
      
      - name: Upload E2E reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports-html
          path: docs/reports/
          retention-days: 30

  deploy-pages:
    runs-on: ubuntu-latest
    needs: generate-dashboard
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download dashboard
        uses: actions/download-artifact@v4
        with:
          name: dashboard-html
          path: docs/dashboard
      
      - name: Download E2E reports
        uses: actions/download-artifact@v4
        with:
          name: e2e-reports-html
          path: docs/reports
        continue-on-error: true
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Commit and push updated dashboard data
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check for changes in dashboard data and e2e reports
          DASHBOARD_CHANGES=$(git status docs/dashboard/data/ --porcelain 2>/dev/null | wc -l)
          REPORTS_CHANGES=$(git status docs/reports/ --porcelain 2>/dev/null | wc -l)
          
          if [ "$DASHBOARD_CHANGES" -gt 0 ] || [ "$REPORTS_CHANGES" -gt 0 ]; then
            echo "📝 Committing updated dashboard and E2E report data..."
            git add docs/dashboard/data/ docs/reports/ 2>/dev/null || true
            git commit -m "chore: Update dashboard KPI data and E2E reports" \
              -m "Updated with latest quality metrics, test results, and E2E test reports" \
              -m "Generated by update-dashboard workflow" \
              -m "Co-authored-by: GitHub Action <action@github.com>"
            git push origin main
            echo "✅ Data committed and pushed"
          else
            echo "ℹ️  No changes to dashboard data or E2E reports"
          fi
      
      - name: Create deployment summary
        run: |
          echo "## 🚀 Dashboard Deployment Complete"
          echo ""
          echo "✅ Quality Dashboard deployed to GitHub Pages"
          echo "📍 URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dashboard/"
          echo ""
          echo "### 📊 Dashboard Features"
          echo "- Real-time test pass rate"
          echo "- Test result trends (30 days)"
          echo "- AI danger rank (A~E)"
          echo "- Code coverage metrics"
          echo "- E2E test reports and videos"
          echo ""
          echo "### 🎬 E2E Test Reports"
          echo "📍 Reports: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/e2e-latest.html"
          echo "- Test case details with videos"
          echo "- Screenshots and failure information"
          echo "- Filter by test status (passed/failed/skipped)"
          echo "- ISO/IEC 25010 quality characteristics status"
          echo "- Historical KPI tracking"

  create-summary-issue:
    runs-on: ubuntu-latest
    needs: [collect-kpi, deploy-pages]
    if: always()
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kpi-data
          path: kpi-data
      
      - name: Create dashboard summary issue
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            // Read KPI data
            let kpiData = { pass_rate: 0, coverage: 0 };
            try {
              const kpiFile = fs.readFileSync('kpi-data/latest-kpi.json', 'utf-8');
              kpiData = JSON.parse(kpiFile);
            } catch (e) {
              console.log('Could not read KPI data:', e.message);
            }
            
            const body = `## 📊 品質ダッシュボード更新完了

            **実行日時**: ${new Date().toLocaleString('ja-JP')}

            ### 📈 最新 KPI

            | 指標 | 値 |
            |---|---|
            | テスト合格率 | ${kpiData.pass_rate}% |
            | コードカバレッジ | ${kpiData.coverage}% |
            | AI危険度ランク | ${kpiData.ai_danger_rank || '-'} |
            | テスト実行数 | ${kpiData.test_count} |
            | 合格テスト | ${kpiData.passed} |
            | 不合格テスト | ${kpiData.failed} |

            ### 📍 ダッシュボード

            - 🌐 [GitHub Pages ダッシュボード](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dashboard/)
            - 📋 [テスト観点シート](./qa/quality-characteristics/)
            - 📦 [KPI データ](./qa/dashboard-data/)

            ### ✨ 機能

            - ✅ テスト合格率の推移グラフ（30日間）
            - ✅ カバレッジ推移グラフ
            - ✅ AI危険度ランク分布
            - ✅ ISO/IEC 25010 品質特性別テスト状況
            - ✅ リアルタイム品質メトリクス

            > 自動生成されたレポート — このメッセージは毎日自動更新されます`;

            try {
              // Find or create quality-dashboard issue
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['dashboard', 'automated'],
                state: 'open',
                per_page: 1
              });

              if (issues.data.length > 0) {
                // Update existing issue
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issues.data[0].number,
                  body: body
                });
                console.log('Updated issue #' + issues.data[0].number);
              } else {
                // Create new issue
                const issue = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '📊 品質ダッシュボード - 本日のレポート',
                  body: body,
                  labels: ['dashboard', 'automated', 'quality-report']
                });
                console.log('Created issue #' + issue.data.number);
              }
            } catch (e) {
              console.log('Could not create/update issue:', e.message);
            }
