name: Bug
description: 再現可能な不具合
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        # ⚠️ M2 自動化ワークフロー対応
        
        このテンプレートで Issue を作成する場合、**M2 read-only intake ワークフロー**が Issue を検証します。
        
        **禁止用語が Issue に含まれていると自動化が停止します：**
        - `auth`, `authentication`, `authorization`, `認証`, `認可` → 脆弱性リスク
        - `personal data`, `PII`, `個人情報` → データ漏洩リスク
        - `payment`, `billing`, `決済`, `請求` → 金銭・詐欺リスク
        - `DROP TABLE`, `TRUNCATE`, `破壊的 DB` → データロスリスク
        
        **詳細は [acceptance テンプレ](acceptance.md) の「禁止用語リスト」を参照してください。**
        
        ---
        
  - type: textarea
    id: reproduction
    attributes: { label: 再現手順, description: 手順・実際の結果・期待結果 }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: 受入条件, description: 修正後に期待する動作 }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: 影響範囲, description: Frontend/Backend/API/DB/Infra/Docs }
    validations: { required: true }
  - type: dropdown
    id: severity
    attributes:
      label: リスク
      options: ["low", "medium", "high", "critical"]
    validations: { required: true }
  - type: textarea
    id: test
    attributes: { label: テスト要求, description: 必須観点と未実施理由 }
    validations: { required: true }
