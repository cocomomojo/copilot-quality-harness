title: Copilot Quality Harness
description: エンタープライズ向けアーティファクトベース ワークフロー チェーンシステム
theme: jekyll-theme-slate
show_downloads: false
lang: ja

# GitHub Pages configuration
plugins:
  - jekyll-gist
  - jekyll-github-metadata
  - jekyll-mentions
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

relative_links:
  enabled: true
  collections: true

include:
  - _pages

exclude:
  - node_modules
  - vendor
  - .vscode
  - .copilot

# Site configuration
url: https://cocomomojo.github.io/copilot-quality-harness
baseurl: /copilot-quality-harness

# Build settings
markdown: kramdown
kramdown:
  parse_block_html: true
  parse_inline_html: true
  input: GFM
  hard_wrap: true

# Markdown configuration
markdown_ext: md,markdown,mdown,mkdn,mkd,ldown

# Collections - Enable markdown files as pages
collections:
  pages:
    output: true
    permalink: /:name/
